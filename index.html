/* ---------------------------------------------------------------------
   VISUAL EFFECTS, PROJECTILES, FORTRESS
   --------------------------------------------------------------------- */
class Particle {
  constructor(x, y, vx, vy, life, color, size, grav) {
    this.reset(x, y, vx, vy, life, color, size, grav);
  }
  reset(x, y, vx, vy, life, color, size, grav) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.max = life; this.color = color;
    this.size = size; this.grav = grav == null ? 120 : grav;
    this.dead = false;
    this.live = false;
    return this;
  }
  update(dt) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    this.vy += this.grav * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vx *= 0.98;
  }
  draw(ctx) {
    const t = Math.max(0, this.life / this.max);
    ctx.globalAlpha = t;
    ctx.fillStyle = this.color;
    const s = this.size * (0.35 + t * 0.65);
    ctx.fillRect(this.x - s / 2, this.y - s / 2, s, s);
    ctx.globalAlpha = 1;
  }
}

class DamageText {
  constructor(x, y, text, color) {
    this.x = x; this.y = y; this.text = text; this.color = color || "#fff";
    this.life = 0.85; this.max = 0.85; this.vy = -52; this.dead = false;
  }
  update(dt) { this.life -= dt; if (this.life <= 0) this.dead = true; this.y += this.vy * dt; this.vy *= 0.94; }
  draw(ctx) {
    const t = Math.max(0, this.life / this.max);
    ctx.globalAlpha = t;
    ctx.font = "700 15px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.8)";
    ctx.strokeText(this.text, this.x, this.y);
    ctx.fillStyle = this.color; ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha = 1;
  }
}

/* transient graphic effects: explosions, arcs, cones, rings, muzzle flash */
class Effect {
  constructor(type, opts) {
    this.type = type; this.dead = false; this.t = 0;
    Object.assign(this, opts);
    this.dur = opts.dur || 0.4;
  }
  update(dt) { this.t += dt; if (this.t >= this.dur) this.dead = true; }
  draw(ctx) {
    const p = clamp(this.t / this.dur, 0, 1);
    const a = 1 - p;
    // ---- sprite-based effects (fall back to vector if assets are absent) ----
    if (this.type === "explosion" && ART.ready && ART.has("fx/explosion_big")) {
      const im = ART.images["fx/explosion_big"];
      const fr = Math.min(11, Math.floor(p * 12));
      const size = (this.radius || 60) * 2.5;
      ctx.save(); ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = Math.min(1, a * 2.4);
      ctx.drawImage(im, fr * 96, 0, 96, 96, this.x - size / 2, this.y - size / 2, size, size);
      ctx.restore(); return;
    }
    if (this.type === "flash" && ART.ready && ART.has("fx/muzzle")) {
      const im = ART.images["fx/muzzle"];
      const fr = Math.min(4, Math.floor(p * 5));
      const size = (this.radius || 12) * 3.4;
      ctx.save(); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = a;
      ctx.drawImage(im, fr * 32, 0, 32, 32, this.x - size / 2, this.y - size / 2, size, size);
      ctx.restore(); return;
    }
    if (this.type === "zdeath" && ART.ready && ART.has("zombie/" + this.zid)) {
      const im = ART.images["zombie/" + this.zid];
      const ad = ZOMBIE_ANIM.death;
      const fr = Math.min(ad.frames - 1, Math.floor(p * ad.frames));
      const scale = ((this.r || 15) * 3.0) / ZS.fh;
      const w = ZS.fw * scale, h = ZS.fh * scale;
      ctx.save(); ctx.imageSmoothingEnabled = false;
      ctx.drawImage(im, fr * ZS.fw, ad.row * ZS.fh, ZS.fw, ZS.fh,
        this.x - w / 2, this.y + (this.r || 15) * 0.62 - h, w, h);
      ctx.restore(); return;
    }
    ctx.globalAlpha = a;
    if (this.type === "explosion") {
      const r = lerp(8, this.radius, Math.sqrt(p));
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      g.addColorStop(0, "rgba(255,240,180,.95)");
      g.addColorStop(0.5, "rgba(255,140,40,.75)");
      g.addColorStop(1, "rgba(255,60,20,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, TAU); ctx.fill();
    } else if (this.type === "ring") {
      ctx.strokeStyle = this.color || "#fff";
      ctx.lineWidth = 4 * a + 1;
      ctx.beginPath(); ctx.arc(this.x, this.y, lerp(6, this.radius, p), 0, TAU); ctx.stroke();
    } else if (this.type === "arc") {
      ctx.strokeStyle = this.color || "#7ff";
      ctx.lineWidth = 2.5; ctx.shadowColor = this.color || "#7ff"; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(this.ax, this.ay);
      const mx = (this.ax + this.bx) / 2 + rand(-16, 16), my = (this.ay + this.by) / 2 + rand(-16, 16);
      ctx.quadraticCurveTo(mx, my, this.bx, this.by); ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (this.type === "flash") {
      ctx.fillStyle = this.color || "#ffe";
      ctx.beginPath(); ctx.arc(this.x, this.y, lerp(this.radius || 10, 2, p), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------------------------------------------------------------------
   PROJECTILES
   --------------------------------------------------------------------- */
class Projectile {
  constructor(opts) {
    Object.assign(this, {
      x: 0, y: 0, vx: 0, vy: 0, dmg: 10, speed: 600, radius: 4,
      color: "#ffe", life: 2, pierce: 0, aoe: 0, burn: 0, slow: 0, slowDur: 0,
      crit: false, kind: "bullet", hitIds: null, dead: false, trail: true,
    }, opts);
    this.hitIds = new Set();
  }
  update(dt, game) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    // sub-step movement so fast bullets can never tunnel through zombies
    const travel = Math.hypot(this.vx, this.vy) * dt;
    const steps = Math.max(1, Math.min(24, Math.ceil(travel / 8)));
    const sdt = dt / steps;
    for (let s = 0; s < steps && !this.dead; s++) this.step(sdt, game);
  }
  step(dt, game) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.x < -40 || this.x > W + 60 || this.y < -60 || this.y > H + 60) { this.dead = true; return; }
    if (this.hostile) {
      // acid lobbed by spitters at a tower or at the fortress wall
      if (dist(this.x, this.y, this.tx, this.ty) < 16) {
        if (this.targetTower && !this.targetTower.dead) this.targetTower.hurt(this.dmg);
        else game.fortress.hurt(this.dmg, game);
        game.effects.push(new Effect("flash", { x: this.x, y: this.y, radius: 20, color: "#9dff9d", dur: 0.25 }));
        game.burst(this.x, this.y, "#9dff9d", 7, 90);
        this.dead = true;
      }
      return;
    }
    for (const z of game.zombies) {
      if (z.dead || this.hitIds.has(z.id)) continue;
      if (dist(this.x, this.y, z.x, z.y) > z.r + this.radius) continue;
      // crawlers hug the ground: slow projectiles sail over them
      if (z.def.low && !this.hostile && this.kind !== "flame" && Math.random() < 0.35) continue;
      this.hitIds.add(z.id);
      if (this.aoe > 0) {
        game.explode(this.x, this.y, this.aoe, this.dmg, this.color);
        this.dead = true; return;
      }
      z.hurt(this.dmg, game, { crit: this.crit, burn: this.burn, slow: this.slow, slowDur: this.slowDur, src: "projectile" });
      game.hitParticles(this.x, this.y, this.color);
      if (this.pierce > 0) { this.pierce--; }
      else { this.dead = true; return; }
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.shadowColor = this.color; ctx.shadowBlur = 9;
    ctx.fillStyle = this.color;
    if (this.kind === "sniper") {
      const ang = Math.atan2(this.vy, this.vx);
      ctx.translate(this.x, this.y); ctx.rotate(ang);
      ctx.fillRect(-11, -2, 22, 4);
    } else {
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   FORTRESS
   --------------------------------------------------------------------- */
class Fortress {
  constructor(maxHp) {
    this.maxHp = maxHp; this.hp = maxHp;
    this.flash = 0; this.regen = 0; this.shake = 0;
  }
  get pct() { return clamp(this.hp / this.maxHp, 0, 1); }
  heal(v) { this.hp = Math.min(this.maxHp, this.hp + v); }
  hurt(v, game) {
    this.hp -= v; this.flash = 0.25; this.shake = 0.3;
    game.fortressTouched = true; game.killCombo = 0;
    if (game.run) game.run.fortressHit = true;
    if (this.hp <= 0) { this.hp = 0; game.gameOver(); }
  }
  update(dt, game) {
    if (this.regen > 0) this.heal(this.regen * dt);
    this.flash = Math.max(0, this.flash - dt * 3);
    this.shake = Math.max(0, this.shake - dt * 3);
  }
  draw(ctx, game) {
    const x = FIELD_LEFT, shake = this.shake > 0 ? rand(-4, 4) * this.shake : 0;
    ctx.save();
    ctx.translate(shake, 0);
    // ground shadow
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(0, 84, x, H - 168);
    // main wall
    const wallArt = ART.ready && ART.images[game && game.fortress && this.pct < 0.5 ? "fortress/wall_blood" : "fortress/wall"];
    if (wallArt) {
      const pat = ctx.createPattern(wallArt, "repeat");
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = pat;
      ctx.fillRect(0, 78, x - 12, H - 156);
      // darken toward the outer edge
      const sh = ctx.createLinearGradient(x - 60, 0, x, 0);
      sh.addColorStop(0, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,.45)");
      ctx.fillStyle = sh; ctx.fillRect(0, 78, x - 12, H - 156);
    } else {
      const g = ctx.createLinearGradient(0, 0, x, 0);
      g.addColorStop(0, "#2b3550"); g.addColorStop(1, "#3d4a6b");
      ctx.fillStyle = g;
      ctx.fillRect(0, 78, x - 12, H - 156);
      ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1;
      for (let yy = 96; yy < H - 80; yy += 22) {
        ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(x - 12, yy); ctx.stroke();
      }
    }
    // buttress stones along the inner edge
    for (let i = 0; i < 6; i++) {
      const yy = 78 + i * (H - 156) / 6;
      ctx.fillStyle = "#242c42";
      ctx.fillRect(x - 12 - 26, yy + 8, 12, 30);
      ctx.fillStyle = "#4d5a82";
      ctx.fillRect(x - 12 - 26, yy + 8, 12, 4);
    }
    // sandbags + battlements
    ctx.fillStyle = "#4a5570";
    for (let yy = 86; yy < H - 80; yy += 26) ctx.fillRect(x - 12, yy, 12, 16);
    ctx.fillStyle = "#59668a";
    ctx.fillRect(0, 70, x - 12, 12);
    // glowing emblem
    const pulse = 0.5 + 0.5 * Math.sin(nowMs() / 420);
    ctx.save();
    ctx.shadowColor = "#57e08a"; ctx.shadowBlur = 22 + pulse * 12;
    ctx.fillStyle = "rgba(87,224,138,.9)";
    ctx.beginPath();
    ctx.moveTo(x / 2 - 26, H / 2 + 26); ctx.lineTo(x / 2 - 26, H / 2 - 16);
    ctx.lineTo(x / 2 - 12, H / 2 - 30); ctx.lineTo(x / 2 + 2, H / 2 - 16);
    ctx.lineTo(x / 2 + 16, H / 2 - 30); ctx.lineTo(x / 2 + 30, H / 2 - 16);
    ctx.lineTo(x / 2 + 30, H / 2 + 26);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#0b1220";
    ctx.beginPath(); ctx.arc(x / 2 - 9, H / 2 - 2, 4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x / 2 + 9, H / 2 - 2, 4, 0, TAU); ctx.fill();
    ctx.fillRect(x / 2 - 8, H / 2 + 12, 16, 5);
    ctx.restore();
    if (this.flash > 0) {
      ctx.globalAlpha = this.flash;
      ctx.fillStyle = "#ff5566";
      ctx.fillRect(0, 78, x - 12, H - 156);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   TOWER - one per build slot. All towers fire automatically.
   --------------------------------------------------------------------- */
class Tower {
  constructor(game, defId, row, col) {
    this.game = game;
    this.def = TOWER_DEFS[defId];
    this.id = defId; this.row = row; this.col = col;
    this.x = SLOT_COLS[col]; this.y = SLOT_ROWS[row];
    this.level = 1; this.invested = this.def.cost;
    this.cd = 0; this.angle = 0; this.flash = 0; this.repairDelay = 0;
    this.dead = false; this.built = 0;
    this.recompute();
    this.hp = this.maxHp;
  }
  get kind() { return this.def.kind; }
  get selectable() { return this.kind !== "block"; }

  recompute() {
    const b = this.def.base;
    const bonus = this.game.bonus;
    const syn = this.game.synergy ? this.game.synergy.modsFor(this) : null;
    const sm = (k) => (syn && syn[k]) || 1;
    const dm = (1 + 0.42 * (this.level - 1)) * sm("dmg");
    const rm = (1 + 0.10 * (this.level - 1)) * sm("rate");
    const rrm = (1 + 0.08 * (this.level - 1)) * sm("range");
    if (this.kind === "block") {
      this.maxHp = Math.round(b.hp * (1 + 0.4 * (this.level - 1)));
      this.taunt = b.taunt;
    } else if (this.kind === "heal") {
      this.heal = b.heal * (1 + 0.5 * (this.level - 1)) * sm("dmg");
      this.maxHp = Math.round(260 * (1 + 0.2 * (this.level - 1)));
    } else if (this.kind === "flame") {
      this.dmg = b.dps * dm * bonus.dmg;
      this.rate = 6;
      this.range = b.range * rrm * bonus.range;
      this.burn = b.burn;
      this.maxHp = Math.round(260 * (1 + 0.2 * (this.level - 1)));
    } else {
      this.dmg = b.dmg * dm * bonus.dmg;
      this.rate = b.rate * rm * bonus.rate;
      this.range = b.range * rrm * bonus.range;
      this.maxHp = Math.round(260 * (1 + 0.2 * (this.level - 1)));
      if (b.pierce) this.pierce = b.pierce;
      if (b.chain) this.chain = b.chain;
      if (b.slow) { this.slow = b.slow; this.slowDur = b.slowDur; }
      this.bulletSpeed = b.bulletSpeed;
    }
  }
  upgradeCost() { return Math.round(this.def.cost * (0.5 + 0.6 * this.level)); }
  sellValue() { return Math.floor(this.invested * 0.6); }
  canUpgrade() { return this.level < MAX_LEVEL && !this.game.mods.noTowerUpgrades; }

  upgrade() {
    if (!this.canUpgrade()) return false;
    const c = this.upgradeCost();
    if (this.game.scrap < c) return false;
    this.game.spendScrap(c);
    this.invested += c; this.level++;
    this.recompute(); this.hp = this.maxHp;
    this.game.audio.sfx("upgrade");
    this.game.spawnRing(this.x, this.y, this.def.color, 60);
    return true;
  }
  repair(v) { this.hp = Math.min(this.maxHp, this.hp + v); this.repairDelay = 0; }
  hurt(v) {
    if (this.kind === "block" && v > 0) {}
    this.hp -= v; this.repairDelay = 6; this.flash = 0.2;
    if (this.hp <= 0) { this.hp = 0; this.die(); }
  }
  die() {
    this.dead = true;
    this.game.burst(this.x, this.y, this.def.color, 22, 210);
    this.game.effects.push(new Effect("ring", { x: this.x, y: this.y, radius: 70, color: this.def.color, dur: 0.5 }));
  }

  update(dt, game) {
    this.flash = Math.max(0, this.flash - dt * 4);
    if (this.built < 1) this.built = Math.min(1, this.built + dt * 4);
    // auto repair after a lull
    if (this.hp < this.maxHp && this.repairDelay <= 0 && this.kind !== "heal") {
      this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.06 * dt);
    }
    if (this.repairDelay > 0) this.repairDelay -= dt;

    if (this.kind === "block") return;
    if (this.kind === "heal") {
      game.fortress.heal(this.heal * dt);
      if (Math.random() < dt * 3) {
        game.emitPfx(this.x + rand(-14, 14), this.y + 10, rand(-6, 6), -rand(20, 45), 0.9, "#9dffcf", 3, -20);
      }
      return;
    }

    // acquire the zombie closest to the fortress inside range
    let target = null, bestX = Infinity;
    for (const z of game.zombies) {
      if (z.dead) continue;
      const d = dist(this.x, this.y, z.x, z.y);
      if (d > this.range + z.r) continue;
      if (z.x < bestX) { bestX = z.x; target = z; }
    }
    if (target) {
      const want = Math.atan2(target.y - this.y, target.x - this.x);
      let diff = ((want - this.angle + Math.PI * 3) % TAU) - Math.PI;
      this.angle += diff * Math.min(1, dt * 12);
    }
    this.cd -= dt;
    if (this.cd <= 0 && target) { this.fire(target, game); this.cd = 1 / this.rate; }
  }

  fire(target, game) {
    this.flash = 0.12;
    const ang = Math.atan2(target.y - this.y, target.x - this.x);
    const mx = this.x + Math.cos(ang) * 18, my = this.y + Math.sin(ang) * 18 - 22;
    const b = this.def.base;
    const crit = Math.random() < game.bonus.crit;
    const dmg = this.dmg * (crit ? 2 : 1);
    if (this.kind === "bullet") {
      game.audio.sfx("shoot");
      game.projectiles.push(new Projectile({
        x: mx, y: my, vx: Math.cos(ang) * b.bulletSpeed, vy: Math.sin(ang) * b.bulletSpeed,
        dmg, radius: 4, color: this.def.accent, crit, speed: b.bulletSpeed,
      }));
      game.effects.push(new Effect("flash", { x: mx, y: my, radius: 12, color: this.def.accent, dur: 0.08 }));
    } else if (this.kind === "shotgun") {
      game.audio.sfx("shotgun");
      for (let i = 0; i < b.pellets; i++) {
        const a = ang + rand(-0.26, 0.26);
        const sp = b.bulletSpeed * rand(0.85, 1.15);
        game.projectiles.push(new Projectile({
          x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          dmg: dmg / b.pellets * 1.6, radius: 3, color: this.def.accent, crit, life: 0.3, speed: sp,
        }));
      }
    } else if (this.kind === "sniper") {
      game.audio.sfx("sniper");
      game.projectiles.push(new Projectile({
        x: mx, y: my, vx: Math.cos(ang) * b.bulletSpeed, vy: Math.sin(ang) * b.bulletSpeed,
        dmg, radius: 5, color: this.def.accent, crit, pierce: this.pierce, kind: "sniper",
      }));
      game.effects.push(new Effect("flash", { x: mx, y: my, radius: 16, color: "#efe", dur: 0.1 }));
    } else if (this.kind === "flame") {
      game.audio.sfx("flame");
      for (const z of game.zombies) {
        if (z.dead) continue;
        const d = dist(this.x, this.y, z.x, z.y);
        if (d > this.range + z.r) continue;
        const za = Math.atan2(z.y - this.y, z.x - this.x);
        let diff = Math.abs(((za - ang + Math.PI * 3) % TAU) - Math.PI);
        if (diff < 0.42) {
          z.hurt(this.dmg, game, { burn: this.burn, src: "flame" });
          z.burning = { t: this.burn, dps: this.dmg * 0.8 };
        }
      }
      for (let i = 0; i < 8; i++) {
        const a = ang + rand(-0.36, 0.36);
        game.emitPfx(
          this.x + Math.cos(a) * 16, this.y - 22 + Math.sin(a) * 16,
          Math.cos(a) * rand(90, 200), Math.sin(a) * rand(90, 200) - 20,
          rand(0.25, 0.5), pick(["#ffd24a", "#ff8a2a", "#ff5a1a"]), rand(4, 9), -30);
      }
      game.effects.push(new Effect("flash", { x: this.x + Math.cos(ang) * 30, y: this.y - 22 + Math.sin(ang) * 30, radius: 20, color: "#ffb347", dur: 0.12 }));
    } else if (this.kind === "tesla") {
      game.audio.sfx("tesla");
      const hit = new Set();
      let cur = target, cx = this.x, cy = this.y - 22;
      let chained = 0;
      while (cur && chained < this.chain) {
        game.effects.push(new Effect("arc", { ax: cx, ay: cy, bx: cur.x, by: cur.y, color: this.def.accent, dur: 0.16 }));
        cur.hurt(dmg * Math.pow(0.82, chained), game, { slow: this.slow, slowDur: this.slowDur, src: "tesla" });
        hit.add(cur.id);
        cx = cur.x; cy = cur.y; chained++;
        let next = null, nd = 130;
        for (const z of game.zombies) {
          if (z.dead || hit.has(z.id)) continue;
          const d = dist(cx, cy, z.x, z.y);
          if (d < nd) { nd = d; next = z; }
        }
        cur = next;
      }
    }
  }

  draw(ctx, game) {
    if (ART.ready && ART.has("tower/" + this.id + "_base")) this.drawSprite(ctx);
    else this.drawVector(ctx, game);
    this.drawHealth(ctx);
  }

  /* pixel-art base + rotating turret */
  drawSprite(ctx) {
    const p = this.built;
    const s = 0.82 + 0.18 * p;
    const baseKey = "tower/" + this.id + "_base";
    const turKey = "tower/" + this.id + "_turret";
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.imageSmoothingEnabled = false;
    // ground shadow
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.ellipse(0, 14, 34 * s, 13 * s, 0, 0, TAU); ctx.fill();
    const bw = 84 * s, bh = 84 * s;
    ctx.drawImage(ART.images[baseKey], -bw / 2, -bh / 2, bw, bh);
    if (this.kind !== "block" && this.kind !== "heal" && ART.has(turKey)) {
      const im = ART.images[turKey];
      let fr = 0;
      if (this.flash > 0) fr = (Math.floor(nowMs() / 45) % 2) ? 1 : 2;
      else if (this.built < 1) fr = 3;
      const tw = 68 * s, th = 68 * s;
      ctx.save();
      ctx.translate(0, 6 * s);
      ctx.rotate(this.angle);
      ctx.drawImage(im, fr * 48, 0, 48, 48, -tw / 2, -th / 2, tw, th);
      ctx.restore();
    }
    for (let i = 0; i < this.level; i++) {
      ctx.fillStyle = this.level >= MAX_LEVEL ? "#ffce4a" : "#7fe0a8";
      ctx.fillRect(-20 + i * 9, 22, 6, 4);
    }
    ctx.restore();
  }

  drawVector(ctx, game) {
    const p = this.built;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(0.8 + 0.2 * p, 0.8 + 0.2 * p);
    // base plate
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.ellipse(0, 12, 30, 12, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#20293d";
    ctx.beginPath(); ctx.roundRect(-24, -12, 48, 26, 6); ctx.fill();
    ctx.strokeStyle = "rgba(150,190,255,.25)"; ctx.lineWidth = 1.5; ctx.stroke();
    // body
    const c = this.flash > 0 ? "#ffffff" : this.def.color;
    ctx.fillStyle = c;
    if (this.kind === "block") {
      ctx.fillStyle = this.flash > 0 ? "#fff" : "#8a7748";
      for (let i = 0; i < 3; i++) { ctx.fillRect(-22, -6 + i * 8, 44, 6); }
      ctx.fillStyle = this.def.accent;
      ctx.fillRect(-22, -8, 44, 3);
    } else if (this.kind === "heal") {
      ctx.beginPath(); ctx.arc(0, -14, 16, 0, TAU); ctx.fill();
      ctx.fillStyle = "#eafff5";
      ctx.fillRect(-3, -23, 6, 18); ctx.fillRect(-9, -17, 18, 6);
    } else {
      ctx.beginPath(); ctx.arc(0, -12, 14, 0, TAU); ctx.fill();
      // turret
      ctx.save();
      ctx.translate(0, -22); ctx.rotate(this.angle);
      ctx.fillStyle = this.def.accent;
      if (this.kind === "sniper") ctx.fillRect(0, -2.5, 30, 5);
      else if (this.kind === "shotgun") { ctx.fillRect(0, -5, 22, 4); ctx.fillRect(0, 1, 22, 4); }
      else if (this.kind === "flame") { ctx.fillRect(0, -4, 20, 8); ctx.beginPath(); ctx.arc(20, 0, 5, 0, TAU); ctx.fill(); }
      else if (this.kind === "tesla") {
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
        ctx.strokeStyle = this.def.accent; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, -8, 9, 0, TAU); ctx.stroke();
      } else ctx.fillRect(0, -3, 24, 6);
      ctx.restore();
      if (this.flash > 0) {
        ctx.globalAlpha = this.flash * 5;
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(Math.cos(this.angle) * 26, -22 + Math.sin(this.angle) * 26, 9, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    // level pips
    for (let i = 0; i < this.level; i++) {
      ctx.fillStyle = this.level >= MAX_LEVEL ? "#ffce4a" : "#7fe0a8";
      ctx.fillRect(-20 + i * 9, 18, 6, 4);
    }
    ctx.restore();
  }

  drawHealth(ctx) {
    if (this.hp < this.maxHp - 0.5) {
      const w = 52, h = 6, x = this.x - w / 2, y = this.y - 50;
      ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = this.kind === "block" ? "#c9b06a" : "#57e08a";
      ctx.fillRect(x, y, w * clamp(this.hp / this.maxHp, 0, 1), h);
    }
  }
  drawRange(ctx) {
    if (this.kind === "heal") { ctx.strokeStyle = "rgba(89,224,160,.5)"; }
    else ctx.strokeStyle = "rgba(140,200,255,.45)";
    ctx.setLineDash([7, 7]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.range || 60, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
}

/* small tower icon renderer used by the build bar and collection screen */
function drawTowerGlyph(canvas, def, locked) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const size = canvas.clientWidth || parseInt(canvas.getAttribute("width"), 10) || 56;
  canvas.width = size * dpr; canvas.height = size * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, size, size);
  const s = size / 56;
  ctx.save();
  ctx.translate(size / 2, size / 2 + 4 * s);
  ctx.scale(s, s);
  ctx.globalAlpha = locked ? 0.5 : 1;
  ctx.fillStyle = "rgba(255,255,255,.07)";
  ctx.beginPath(); ctx.roundRect(-22, -22, 44, 44, 10); ctx.fill();
  // pixel-art glyph when the sprites are loaded
  if (ART.ready && ART.has("tower/" + def.id + "_base")) {
    ctx.imageSmoothingEnabled = false;
    const bs = 40;
    ctx.drawImage(ART.images["tower/" + def.id + "_base"], -bs / 2, -bs / 2 + 6, bs, bs);
    if (ART.has("tower/" + def.id + "_turret")) {
      const ts = 30;
      ctx.drawImage(ART.images["tower/" + def.id + "_turret"], 0, 0, 48, 48, -ts / 2, -ts / 2 - 6, ts, ts);
    }
    ctx.restore();
    return;
  }
  const c = def.color;
  if (def.kind === "block") {
    ctx.fillStyle = c;
    for (let i = 0; i < 3; i++) ctx.fillRect(-16, -12 + i * 9, 32, 7);
  } else if (def.kind === "heal") {
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU); ctx.fill();
    ctx.fillStyle = "#0b1220"; ctx.fillRect(-3, -10, 6, 20); ctx.fillRect(-10, -3, 20, 6);
  } else {
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 6, 13, 0, TAU); ctx.fill();
    ctx.fillStyle = def.accent;
    ctx.save(); ctx.translate(0, -6); ctx.rotate(-Math.PI / 4);
    ctx.fillRect(0, -3, 24, 6); ctx.restore();
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------
   ZOMBIE - walks right-to-left, smashes whatever blocks the way.
   --------------------------------------------------------------------- */
class Zombie {
  constructor(typeId, lane, wave, game, opts) {
    opts = opts || {};
    const d = ZOMBIE_DEFS[typeId];
    this.type = typeId; this.def = d;
    this.id = game.nextId();
    this.lane = lane;
    this.x = opts.x != null ? opts.x : SPAWN_X + rand(0, 60);
    this.y = LANES[lane] + rand(-16, 16);
    this.maxHp = d.hp * game.waveHpMul * (opts.hpMul || 1);
    this.hp = this.maxHp;
    this.speed = d.speed * game.waveSpeedMul * (opts.speedMul || 1) * (game.mods.zombieSpeed || 1) * (game.weatherZombieSpeed || 1);
    this.dmg = d.dmg * game.waveDmgMul;
    this.scrap = Math.max(1, Math.round(d.scrap * (1 + wave * 0.05) * (game.mutationScrap || 1)));
    this.r = d.r;
    this.vuln = (opts.vuln != null ? opts.vuln : 1) * (game.mutationVuln || 1);
    this.dead = false;
    this.attackCd = 0;
    this.slowMul = 1; this.slowT = 0;
    this.frozenT = 0; this.burning = null; this.rageT = 0;
    this.phase = rand(0, TAU);
    this.hitFlash = 0;
    this.target = null;          // {type:'tower'|'fortress', tower}
    this.state = "walk";
    this.lunge = 0;
    this.spawnAnim = 0;
  }
  get armored() { return this.def.armor || 0; }

  hurt(amount, game, opts) {
    opts = opts || {};
    if (this.dead) return 0;
    let dmg = amount;
    const armor = this.armored;
    if (armor && opts.src !== "flame" && opts.src !== "burn") dmg = Math.max(1, dmg - armor * 0.5);
    // shield-bearers angle their cover at the towers: bullet/shotgun/sniper
    // rounds glance off, but fire, lightning and explosions ignore the cover
    if (this.def.frontArmor && opts.src === "projectile") {
      dmg *= 0.45;
    }
    if (this.vuln && this.vuln !== 1) dmg *= this.vuln;
    this.hp -= dmg;
    this.hitFlash = 0.12;
    if (opts.burn) this.burning = { t: Math.max(this.burning ? this.burning.t : 0, opts.burn), dps: Math.max(this.burning ? this.burning.dps : 0, dmg * 0.5) };
    if (opts.slow) {
      this.slowMul = Math.min(this.slowMul, 1 - opts.slow);
      this.slowT = Math.max(this.slowT, opts.slowDur || 1.5);
    }
    if (dmg >= 6 && (dmg > 20 || Math.random() < 0.5)) game.damageTexts.push(new DamageText(this.x + rand(-8, 8), this.y - this.r - 6, (opts.crit ? "\u2726" : "") + Math.round(dmg), opts.crit ? "#ffce4a" : "#ffffff"));
    if (this.hp <= 0) this.die(game);
    return dmg;
  }
  die(game) {
    if (this.dead) return;
    this.dead = true;
    game.onZombieKilled(this);
  }

  update(dt, game) {
    if (this.dead) return;
    this.spawnAnim = Math.min(1, this.spawnAnim + dt * 3);
    this.hitFlash = Math.max(0, this.hitFlash - dt * 6);
    if (this.burning && this.burning.t > 0) {
      this.burning.t -= dt;
      this.hp -= this.burning.dps * dt;
      if (Math.random() < dt * 14) game.emitPfx(this.x + rand(-8, 8), this.y - rand(0, 20), rand(-14, 14), -rand(30, 70), 0.4, pick(["#ffb347", "#ff6a3d"]), rand(3, 6), -40);
      if (this.hp <= 0) { this.die(game); return; }
    }
    if (this.slowT > 0) { this.slowT -= dt; if (this.slowT <= 0) this.slowMul = 1; }
    if (this.frozenT > 0) this.frozenT -= dt;
    if (this.rageT > 0) this.rageT -= dt;
    this.lunge = Math.max(0, this.lunge - dt * 4);

    const frozen = this.frozenT > 0;
    let spd = this.speed * this.slowMul * (frozen ? 0.05 : 1) * (this.rageT > 0 ? 1.3 : 1);
    this.phase += spd * dt * 0.055;

    // pick a target: nearby barricade taunts, otherwise the fortress
    let towerTarget = null, bestD = Infinity;
    for (const t of game.towers) {
      if (t.dead || t.kind !== "block") continue;
      const d = dist(this.x, this.y, t.x, t.y);
      if (d < (t.taunt || 0) && d < bestD) { bestD = d; towerTarget = t; }
    }
    this.target = towerTarget ? { type: "tower", tower: towerTarget } : { type: "fortress" };

    const ranged = this.def.ranged;
    // movement / attacking
    if (this.target.type === "tower") {
      const t = this.target.tower;
      const d = dist(this.x, this.y, t.x, t.y);
      if (d > this.r + 26) this.moveTo(t.x, t.y, spd, dt);
      else this.attack(t, game, dt, true);
    } else {
      const stopAt = ranged ? FORTRESS_X + ranged : FORTRESS_X + this.r;
      if (this.x > stopAt) this.moveTo(stopAt, this.y, spd, dt);
      else this.attack(null, game, dt, false);
    }

    // specials
    if (this.def.summon && !frozen) {
      this.summonT = (this.summonT || this.def.summon) - dt;
      if (this.summonT <= 0) {
        this.summonT = this.def.summon;
        game.audio.sfx("growl");
        game.effects.push(new Effect("ring", { x: this.x, y: this.y, radius: 60, color: "#c06fd8", dur: 0.5 }));
        for (let i = 0; i < 2; i++) game.spawnZombie("walker", randInt(0, LANES.length - 1), { x: this.x + rand(-20, 20), hpMul: 0.9 });
      }
    }
    if (this.def.boss && !frozen) {
      this.roarT = (this.roarT || this.def.roar) - dt;
      if (this.roarT <= 0) {
        this.roarT = this.def.roar;
        game.audio.sfx("boss");
        game.effects.push(new Effect("ring", { x: this.x, y: this.y, radius: 300, color: "#ff5566", dur: 0.7 }));
        for (const z of game.zombies) if (!z.dead && dist(z.x, z.y, this.x, this.y) < 320) z.rageT = 6;
        game.shake = Math.max(game.shake, 0.4);
      }
    }
  }
  moveTo(tx, ty, spd, dt) {
    const dx = tx - this.x, dy = ty - this.y;
    const d = Math.hypot(dx, dy) || 1;
    this.x += (dx / d) * spd * dt;
    this.y += (dy / d) * spd * dt * 0.6;
    this.y = clamp(this.y, LANES[0] - 44, LANES[LANES.length - 1] + 44);
  }
  attack(tower, game, dt, isTower) {
    this.attackCd -= dt;
    if (this.attackCd > 0) return;
    this.attackCd = this.def.rate;
    this.lunge = 1;
    if (this.def.ranged) {
      game.audio.sfx("spit");
      const tx = isTower ? tower.x : FORTRESS_X + 4;
      const ty = isTower ? tower.y : clamp(this.y, 100, H - 100);
      const ang = Math.atan2(ty - this.y, tx - this.x);
      const sp = 300;
      game.hostile.push(new Projectile({
        x: this.x, y: this.y - 14, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        hostile: true, tx, ty, dmg: this.dmg * 1.5, radius: 6, color: "#9dff9d",
        targetTower: isTower ? tower : null, life: 4,
      }));
      return;
    }
    if (isTower && tower) {
      tower.hurt(this.dmg);
      game.effects.push(new Effect("flash", { x: tower.x - 14, y: tower.y, radius: 14, color: "#ffd0d0", dur: 0.16 }));
      game.emitPfx(tower.x - 12, tower.y, -rand(20, 90), rand(-40, 40), 0.4, "#d9c06a", 4, 200);
    } else {
      game.fortress.hurt(this.dmg, game);
      game.audio.sfx("hit");
      game.effects.push(new Effect("flash", { x: FORTRESS_X - 4, y: this.y, radius: 18, color: "#ff8090", dur: 0.2 }));
    }
  }

  draw(ctx, game) {
    if (!(ART.ready && ART.has("zombie/" + this.type) && this.drawSprite(ctx))) this.drawVector(ctx, game);
    this.drawStatus(ctx);
  }

  /* pixel-art animated body; returns false when the sheet is unavailable */
  drawSprite(ctx) {
    const key = "zombie/" + this.type;
    let anim = "walk";
    if (this.spawnAnim < 1) anim = "spawn";
    else if (this.hitFlash > 0) anim = "hurt";
    else if (this.lunge > 0.15) anim = "attack";
    const a = ZOMBIE_ANIM[anim] || ZOMBIE_ANIM.walk;
    const t = (nowMs() / 1000) * a.fps + this.phase * 2.2;
    const col = Math.floor(t) % a.frames;
    const scale = (this.r * 3.0) / ZS.fh;
    const w = ZS.fw * scale, h = ZS.fh * scale;
    const dy = this.y + this.r * 0.62;
    // ground shadow
    ctx.fillStyle = "rgba(0,0,0,.42)";
    ctx.beginPath(); ctx.ellipse(this.x, this.y + this.r * 0.68, this.r * 0.95, this.r * 0.34, 0, 0, TAU); ctx.fill();
    if (this.hitFlash > 0) {
      ctx.save(); ctx.globalAlpha = Math.min(0.9, this.hitFlash * 5); ctx.globalCompositeOperation = "lighter";
      artFrame(ctx, key, col, a.row, ZS.fw, ZS.fh, this.x, dy, w, h, false);
      ctx.restore();
    }
    artFrame(ctx, key, col, a.row, ZS.fw, ZS.fh, this.x, dy, w, h, false);
    return true;
  }

  /* original vector drawing, used as a fallback before assets load */
  drawVector(ctx, game) {
    const s = 0.7 + 0.3 * this.spawnAnim;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(s, s);
    // shadow
    ctx.fillStyle = "rgba(0,0,0,.4)";
    ctx.beginPath(); ctx.ellipse(0, this.r, this.r * 0.9, this.r * 0.36, 0, 0, TAU); ctx.fill();
    const body = this.hitFlash > 0 ? "#ffffff" : this.def.color;
    const dark = "#26301f";
    const legSwing = Math.sin(this.phase) * (this.r * 0.4);
    // legs
    ctx.strokeStyle = dark; ctx.lineWidth = this.r * 0.34; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-this.r * 0.1, -this.r * 0.2); ctx.lineTo(-this.r * 0.1 + legSwing, this.r * 0.85);
    ctx.moveTo(this.r * 0.1, -this.r * 0.2); ctx.lineTo(this.r * 0.1 - legSwing, this.r * 0.85);
    ctx.stroke();
    // torso
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.roundRect(-this.r * 0.6, -this.r * 1.05, this.r * 1.2, this.r * 1.1, this.r * 0.3); ctx.fill();
    // arms reaching left
    ctx.strokeStyle = body; ctx.lineWidth = this.r * 0.3;
    ctx.beginPath();
    ctx.moveTo(-this.r * 0.3, -this.r * 0.85); ctx.lineTo(-this.r * 1.35, -this.r * 0.7 + legSwing * 0.5);
    ctx.moveTo(this.r * 0.3, -this.r * 0.85); ctx.lineTo(-this.r * 1.05, -this.r * 0.95 - legSwing * 0.5);
    ctx.stroke();
    // head
    ctx.fillStyle = this.hitFlash > 0 ? "#fff" : this.def.color;
    ctx.beginPath(); ctx.arc(-this.r * 0.15, -this.r * 1.5, this.r * 0.52, 0, TAU); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(-this.r * 0.4, -this.r * 1.6, this.r * 0.13, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-this.r * 0.02, -this.r * 1.62, this.r * 0.13, 0, TAU); ctx.fill();
    ctx.fillStyle = "#8dff7a";
    ctx.beginPath(); ctx.arc(-this.r * 0.4, -this.r * 1.62, this.r * 0.06, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-this.r * 0.02, -this.r * 1.64, this.r * 0.06, 0, TAU); ctx.fill();
    ctx.restore();
  }

  drawStatus(ctx) {
    // status tint
    if (this.frozenT > 0) {
      ctx.globalAlpha = clamp(this.frozenT, 0, 1) * 0.55;
      ctx.fillStyle = "#8fe4ff";
      ctx.beginPath(); ctx.arc(this.x, this.y - this.r * 0.5, this.r * 1.15, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (this.slowT > 0) {
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = "#6fd0ff";
      ctx.beginPath(); ctx.arc(this.x, this.y - this.r * 0.5, this.r * 1.05, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // boss crown
    if (this.def.boss) {
      ctx.save();
      ctx.shadowColor = "#ffce4a"; ctx.shadowBlur = 14;
      ctx.fillStyle = "#ffce4a";
      ctx.beginPath();
      ctx.moveTo(this.x - 18, this.y - this.r * 2.05);
      ctx.lineTo(this.x - 18, this.y - this.r * 2.5);
      ctx.lineTo(this.x - 8, this.y - this.r * 2.15);
      ctx.lineTo(this.x, this.y - this.r * 2.6);
      ctx.lineTo(this.x + 8, this.y - this.r * 2.15);
      ctx.lineTo(this.x + 18, this.y - this.r * 2.5);
      ctx.lineTo(this.x + 18, this.y - this.r * 2.05);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // hp bar
    const w = this.r * 2.4, h = this.def.boss ? 8 : 5;
    const bx = this.x - w / 2, by = this.y - this.r * (this.def.boss ? 3.5 : 2.4) - 8;
    ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(bx, by, w, h);
    const pct = clamp(this.hp / this.maxHp, 0, 1);
    ctx.fillStyle = pct > 0.5 ? "#ff6b6b" : pct > 0.22 ? "#ffb347" : "#ffe066";
    ctx.fillRect(bx, by, w * pct, h);
    if (this.def.boss) {
      ctx.font = "700 11px Segoe UI, sans-serif"; ctx.textAlign = "center";
      ctx.fillStyle = "#ffd9dd";
      ctx.fillText(T(this.def.name).toUpperCase(), this.x, by - 5);
    }
  }
}

/* ---------------------------------------------------------------------
   WAVEMANAGER - builds and spawns each wave
   --------------------------------------------------------------------- */
class WaveManager {
  constructor(game) { this.game = game; this.reset(); }
  reset() {
    this.active = false; this.wave = 0;
    this.queue = []; this.spawnTimer = 0; this.interval = 0.9;
    this.spawned = 0; this.total = 0; this.bossWave = false; this.prepTimer = 0;
  }
  isBossWave(n) { return n % 5 === 0 || (this.game.mods.bossEvery && n % this.game.mods.bossEvery === 0); }

  buildQueue(n) {
    const diff = DIFFICULTIES[this.game.state.settings.difficulty] || DIFFICULTIES.normal;
    let count = Math.max(3, Math.round((3 + n * 1.7) * diff.count));
    const mut = this.game.mutations ? this.game.mutations.current.mod || {} : {};
    if (mut.count) count = Math.max(3, Math.round(count * mut.count));
    const pool = [];
    pool.push(["walker", 1]);
    if (n >= 3) pool.push(["runner", Math.min(0.75, 0.15 + n * 0.035)]);
    if (n >= 5) pool.push(["tank", Math.min(0.5, 0.06 + n * 0.022)]);
    if (n >= 7) pool.push(["spitter", Math.min(0.42, 0.05 + n * 0.02)]);
    if (n >= 9) pool.push(["screamer", Math.min(0.28, 0.03 + n * 0.014)]);
    if (n >= 4) pool.push(["crawler", Math.min(0.4, 0.06 + n * 0.02)]);
    if (n >= 6) pool.push(["bomber", Math.min(0.3, 0.04 + n * 0.016)]);
    if (n >= 8) pool.push(["brute", Math.min(0.34, 0.03 + n * 0.018)]);
    if (n >= 11) pool.push(["shield", Math.min(0.3, 0.03 + n * 0.016)]);
    const list = [];
    for (let i = 0; i < count; i++) {
      let r = Math.random(), acc = 0, type = "walker";
      const totalW = pool.reduce((s, p) => s + p[1], 0);
      for (const [id, w] of pool) { acc += w / totalW; if (r <= acc) { type = id; break; } }
      list.push(type);
    }
    this.bossWave = this.isBossWave(n);
    if (this.bossWave) { list.length = Math.max(3, Math.round(list.length * 0.7)); list.push("boss"); }
    if (mut.elite && !this.bossWave) { list.push("brute"); }
    // shuffle but keep the boss at the end
    if (this.bossWave) { list.pop(); list.sort(() => Math.random() - 0.5); list.push("boss"); }
    else list.sort(() => Math.random() - 0.5);
    return list;
  }
  startWave(n) {
    this.wave = n;
    this.queue = this.buildQueue(n);
    this.total = this.queue.length; this.spawned = 0;
    this.interval = Math.max(0.20, 0.72 - n * 0.010);
    this.spawnTimer = 0.3;
    this.active = true;
    this.game.waveHpMul = (1 + 0.17 * (n - 1) + 0.0045 * (n - 1) * (n - 1)) * (DIFFICULTIES[this.game.state.settings.difficulty] || DIFFICULTIES.normal).hp * (this.game.mods.zombieHp || 1);
    this.game.waveSpeedMul = Math.min(1.9, 1 + 0.013 * (n - 1)) * (DIFFICULTIES[this.game.state.settings.difficulty] || DIFFICULTIES.normal).speed;
    this.game.waveDmgMul = 1 + 0.045 * (n - 1);
    this.game.audio.sfx("wave");
    if (this.bossWave) { this.game.audio.sfx("boss"); this.game.ui.toast("\u2620 A BOSS APPROACHES", "#ff8093"); }
  }
  update(dt) {
    if (!this.active) return;
    if (this.queue.length) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        this.spawnTimer = this.interval * rand(0.72, 1.28);
        const type = this.queue.shift();
        const lane = randInt(0, LANES.length - 1);
        this.game.spawnZombie(type, lane);
        if (this.game.mutationMultiLane && Math.random() < 0.6) {
          const other = (lane + randInt(1, LANES.length - 1)) % LANES.length;
          this.game.spawnZombie("walker", other, { hpMul: 0.7 });
        }
        this.spawned++;
      }
    }
  }
  get doneSpawning() { return this.active && this.queue.length === 0; }
}

/* ---------------------------------------------------------------------
   ACHIEVEMENTSYSTEM
   --------------------------------------------------------------------- */
class AchievementSystem {
  constructor(game) { this.game = game; }
  has(id) { return this.game.state.achievements.some((a) => a.id === id); }
  unlock(id, silent) {
    if (this.has(id)) return false;
    const def = ACHIEVEMENTS.find((a) => a.id === id);
    if (!def) return false;
    this.game.state.achievements.push({ id, unlocked: true, date: new Date().toISOString() });
    this.game.save();
    if (!silent) {
      this.game.audio.sfx("achievement");
      this.game.ui.toast("\u{1F3C6} " + def.name + " \u2014 " + def.ds, "#ffce4a");
      this.game.celebration(def);
    }
    return true;
  }
  check() {
    const g = this.game, st = g.state, run = g.run;
    if (!st) return;
    if (st.totalKills >= 1) this.unlock("first_blood");
    if (st.totalKills >= 100) this.unlock("kills_100");
    if (st.totalKills >= 1000) this.unlock("kills_1000");
    if (st.totalKills >= 10000) this.unlock("kills_10000");
    if (st.highestWave >= 5) this.unlock("wave_5");
    if (st.highestWave >= 10) this.unlock("wave_10");
    if (st.highestWave >= 20) this.unlock("wave_20");
    if (st.highestWave >= 30) this.unlock("endless_30");
    if (st.unlockedTowers.length >= TOWER_IDS.length) this.unlock("all_towers");
    if ((run && run.bossKills >= 1) || st.bossKills) this.unlock("boss_slay");
    if (run && run.wavesCleared >= 10 && !run.fortressHit) this.unlock("flawless_10");
    if (run && run.combo >= 50) this.unlock("combo_50");
    if (rankFor(g.score()).name === "Legend" || RANKS.indexOf(rankFor(g.score())) >= 3) this.unlock("rank_legend");
    if (st.dailyChallengeCompleted === dateKey()) this.unlock("daily_done");
    if (st.dailyStreak >= 7) this.unlock("streak_7");
    if (st.gold >= 1000) this.unlock("rich");
  }
}

/* ---------------------------------------------------------------------
   DAILYREWARDSYSTEM - streak bonus + a seeded challenge of the day
   --------------------------------------------------------------------- */
function yesterdayKey() {
  const d = new Date(); d.setDate(d.getDate() - 1); return dateKey(d);
}
class DailyRewardSystem {
  constructor(game) { this.game = game; this.refresh(); }
  refresh() {
    const st = this.game.state;
    const today = dateKey();
    this.today = today;
    if (st.lastPlayedDate !== today) {
      st.dailyStreak = st.lastPlayedDate === yesterdayKey() ? (st.dailyStreak || 0) + 1 : 1;
      st.lastPlayedDate = today;
      this.game.save();
    }
    this.challenge = dailyChallengeFor(today);
    this.challengeDone = st.dailyChallengeCompleted === today;
    this.rewardAvailable = st.dailyRewardClaimedDate !== today;
    this.streak = st.dailyStreak || 1;
  }
  claim() {
    if (!this.rewardAvailable) return null;
    const st = this.game.state;
    const gold = 30 + this.streak * 12;
    const scrap = 60 + this.streak * 25;
    const meds = 5 + Math.floor(this.streak / 2);
    st.gold += gold; st.scrap += scrap; st.meds += meds;
    st.dailyRewardClaimedDate = this.today;
    this.rewardAvailable = false;
    this.game.save();
    this.game.audio.sfx("coin");
    return { gold, scrap, meds, streak: this.streak };
  }
  completeChallenge() {
    if (this.challengeDone) return null;
    const st = this.game.state;
    st.dailyChallengeCompleted = this.today;
    this.challengeDone = true;
    const reward = { gold: 150, meds: 15, food: 20 };
    st.gold += reward.gold; st.food += reward.food; st.meds += reward.meds;
    this.game.save();
    this.game.audio.sfx("achievement");
    return reward;
  }
  // returns true when the active run satisfies the daily challenge target
  runMatches(run) {
    return run && run.wavesCleared >= this.challenge.target;
  }
}

/* =====================================================================
   META PROGRESSION SYSTEMS (v3)
   Each system reads/writes SaveSystem state and contributes modifiers to
   the run through the shared key vocabulary used by Game.computeBonus():
     multipliers : dmg rate range scrapGain cooldown costMul
     additive    : fhp regen startScrap startGold crit waveFood waveMeds researchRate
   ===================================================================== */

const MUL_KEYS = ["dmg", "rate", "range", "scrapGain", "cooldown", "costMul"];
function mergeMods(target, src) {
  if (!src) return target;
  for (const k in src) {
    const v = src[k];
    if (typeof v !== "number" || !isFinite(v)) continue;
    if (MUL_KEYS.indexOf(k) >= 0) target[k] = (target[k] == null ? 1 : target[k]) * v;
    else target[k] = (target[k] || 0) + v;
  }
  return target;
}
function heroLevelXp(level) { return Math.round(120 * Math.pow(1.35, level - 1)); }

/* ------------------------------------------------------------------ */
class HeroSystem {
  constructor(game) { this.game = game; }
  progress(id) {
    const st = this.game.state;
    if (!st.heroProgress[id]) st.heroProgress[id] = { level: 1, xp: 0, unlocked: (HERO_DEFS[id] && HERO_DEFS[id].unlockCost === 0) };
    const p = st.heroProgress[id];
    if (HERO_DEFS[id] && HERO_DEFS[id].unlockCost === 0) p.unlocked = true;
    return p;
  }
  unlocked(id) { return !!this.progress(id).unlocked; }
  current() { return HERO_DEFS[this.game.state.selectedHero] || HERO_DEFS.commander; }
  select(id) {
    if (!HERO_DEFS[id] || !this.unlocked(id)) return false;
    this.game.state.selectedHero = id; this.game.save(); return true;
  }
  unlock(id) {
    const def = HERO_DEFS[id]; if (!def) return false;
    const p = this.progress(id);
    if (p.unlocked) return false;
    const st = this.game.state;
    if (st.gold < def.unlockCost) return false;
    st.gold -= def.unlockCost; p.unlocked = true; this.game.save(); return true;
  }
  addXp(id, amount) {
    const p = this.progress(id);
    p.xp += Math.max(0, Math.round(amount));
    let leveled = 0;
    while (p.xp >= heroLevelXp(p.level)) { p.xp -= heroLevelXp(p.level); p.level++; leveled++; }
    return leveled;
  }
  /* combined hero modifiers (base stats + level bonus) */
  mods() {
    const def = this.current(), s = def.stats || {};
    const lvl = this.progress(def.id).level;
    const out = {
      dmg: (s.dmg || 1) * (1 + 0.015 * (lvl - 1)),
      rate: s.rate || 1,
      range: 1,
      fhp: (s.fhp || 0) + Math.round(30 * (lvl - 1)),
      regen: s.regen || 0,
      crit: s.crit || 0,
      cooldown: s.cooldown || 1,
      startScrap: s.scrap || 0,
      costMul: s.costMul || 1,
    };
    return out;
  }
}

/* ------------------------------------------------------------------ */
class RelicSystem {
  constructor(game) { this.game = game; }
  has(id) { return this.game.state.relics.collected.indexOf(id) >= 0; }
  granted(id) {
    const st = this.game.state;
    if (this.has(id)) return false;
    st.relics.collected.push(id);
    st.stats.relicsFound = (st.stats.relicsFound || 0) + 1;
    if (st.relics.equipped.length < 3) st.relics.equipped.push(id);
    this.game.meta.codex.unlock("relic_" + id, "Relics", RELIC_DEFS[id] ? RELIC_DEFS[id].name : id, "A relic recovered from the horde.");
    this.game.ui.toast("\u{1F48E} Relic found: " + (RELIC_DEFS[id] ? RELIC_DEFS[id].name : id), RELIC_RARITY_COLOR[RELIC_DEFS[id] ? RELIC_DEFS[id].rarity : "common"]);
    this.game.audio.sfx("achievement");
    this.game.save();
    return true;
  }
  grantRandom(weight) {
    const pool = Object.keys(RELIC_DEFS).filter((id) => !this.has(id));
    if (!pool.length) return null;
    const rar = { common: 55, rare: 30, epic: 12, legendary: 3 };
    const weighted = [];
    for (const id of pool) { const r = RELIC_DEFS[id].rarity; weighted.push([id, rar[r] || 10]); }
    const total = weighted.reduce((a, b) => a + b[1], 0);
    let roll = Math.random() * total, chosen = pool[0];
    for (const [id, w] of weighted) { roll -= w; if (roll <= 0) { chosen = id; break; } }
    this.granted(chosen); return chosen;
  }
  toggleEquip(id) {
    const eq = this.game.state.relics.equipped;
    const i = eq.indexOf(id);
    if (i >= 0) { eq.splice(i, 1); }
    else { if (eq.length >= 3) { this.game.ui.toast("Equip limit is 3 \u2014 unequip one first.", "#ffb347"); return false; } eq.push(id); }
    this.game.save(); return true;
  }
  mods() {
    const out = {};
    for (const id of this.game.state.relics.equipped) {
      const def = RELIC_DEFS[id]; if (def) mergeMods(out, def.mod);
    }
    return out;
  }
}

/* ------------------------------------------------------------------ */
class ResearchSystem {
  constructor(game) { this.game = game; }
  has(id) { return this.game.state.research.nodes.indexOf(id) >= 0; }
  canBuy(id) {
    const n = RESEARCH_NODES[id]; if (!n || this.has(id)) return false;
    if (this.game.state.research.points < n.cost) return false;
    return n.req.every((r) => this.has(r));
  }
  buy(id) {
    if (!this.canBuy(id)) return false;
    const st = this.game.state.research;
    st.points -= RESEARCH_NODES[id].cost; st.spent += RESEARCH_NODES[id].cost;
    st.nodes.push(id);
    this.game.audio.sfx("upgrade"); this.game.save(); return true;
  }
  addPoints(n) { this.game.state.research.points += Math.max(0, n | 0); this.game.save(); }
  mods() { const out = {}; for (const id of this.game.state.research.nodes) { const n = RESEARCH_NODES[id]; if (n) mergeMods(out, n.mod); } return out; }
}

/* ------------------------------------------------------------------ */
class CampSystem {
  constructor(game) { this.game = game; }
  buildings() { return this.game.state.camp.buildings; }
  level(id) { return this.buildings()[id] || 0; }
  cost(id) { const b = CAMP_BUILDINGS[id]; return b ? b.cost(this.level(id)) : null; }
  canBuild(id) {
    const b = CAMP_BUILDINGS[id];
    if (!b || this.level(id) >= b.maxLevel) return false;
    const c = this.cost(id), m = this.game.state.camp.materials;
    for (const k in c) if ((m[k] || 0) < c[k]) return false;
    return true;
  }
  build(id, free) {
    if (!free && !this.canBuild(id)) return false;
    const b = CAMP_BUILDINGS[id]; if (!b) return false;
    if (!free) { const c = this.cost(id), m = this.game.state.camp.materials; for (const k in c) m[k] -= c[k]; }
    this.buildings()[id] = this.level(id) + 1;
    this.game.audio.sfx("build"); this.game.save(); return true;
  }
  clockIn(ms) {
    const due = 0;
    this.game.state.camp.lastTick = this.game.state.camp.lastTick || ms;
    void due;
  }
  /* award idle materials based on elapsed real time, capped at 8 hours */
  collectIdle(now) {
    const camp = this.game.state.camp;
    // first ever call after install/load: stamp the clock, never dump 8h at once
    if (!camp.lastTick) { camp.lastTick = now; this.game.save(); return null; }
    const last = camp.lastTick;
    const hrs = Math.min(8, (now - last) / 3600000);
    camp.lastTick = now;
    if (hrs <= 0) return null;
    const lv = (id) => camp.buildings[id] || 0;
    const rate = { wood: 6 * lv("farm") + 3 * lv("workshop"), metal: 5 * lv("workshop") + 3 * lv("barracks"), food: 4 * lv("clinic") + 2 * lv("farm") };
    const gain = {};
    for (const k in rate) { const v = Math.floor(rate[k] * hrs); if (v > 0) { camp.materials[k] = (camp.materials[k] || 0) + v; gain[k] = v; } }
    if (Object.keys(gain).length) this.game.save();
    return Object.keys(gain).length ? gain : null;
  }
  mods() { const out = {}; for (const id in CAMP_BUILDINGS) { const l = this.level(id); if (l > 0) mergeMods(out, CAMP_BUILDINGS[id].mod(l)); } return out; }
}

/* ------------------------------------------------------------------ */
class SurvivorSystem {
  constructor(game) { this.game = game; }
  has(id) { return this.game.state.survivors.recruited.indexOf(id) >= 0; }
  cost(id) { return SURVIVOR_DEFS[id] ? SURVIVOR_DEFS[id].cost : null; }
  /* every survivor cost key is read through one resolver so a missing
     material bucket can never compare/deduct as NaN */
  _have(key) {
    const st = this.game.state, m = st.camp.materials;
    if (key === "gold") return st.gold || 0;
    if (key === "meds") return st.meds || 0;
    return m[key] || 0;
  }
  _spend(key, n) {
    const st = this.game.state, m = st.camp.materials;
    if (key === "gold") st.gold = Math.max(0, st.gold - n);
    else if (key === "meds") st.meds = Math.max(0, st.meds - n);
    else m[key] = Math.max(0, (m[key] || 0) - n);
  }
  canRecruit(id) {
    const d = SURVIVOR_DEFS[id]; if (!d || this.has(id)) return false;
    for (const k in d.cost) if (this._have(k) < d.cost[k]) return false;
    return true;
  }
  recruit(id) {
    if (!this.canRecruit(id)) return false;
    const d = SURVIVOR_DEFS[id], st = this.game.state;
    for (const k in d.cost) this._spend(k, d.cost[k]);
    st.survivors.recruited.push(id);
    this.game.audio.sfx("upgrade"); this.game.save(); return true;
  }
  mods() { const out = {}; for (const id of this.game.state.survivors.recruited) { const d = SURVIVOR_DEFS[id]; if (d && d.perk) mergeMods(out, d.perk); } return out; }
}

/* ------------------------------------------------------------------ */
class CodexSystem {
  constructor(game) { this.game = game; }
  has(id) { return this.game.state.codex.entries.indexOf(id) >= 0; }
  unlock(id, cat, name, ds) {
    if (!id || this.has(id)) return false;
    this.game.state.codex.entries.push(id);
    if (cat) {
      const entry = CODEX_ENTRIES.find((e) => e.id === id);
      if (!entry) CODEX_ENTRIES.push({ id, cat, name: name || id, ds: ds || "" });
    }
    this.game.save(); return true;
  }
  percent() { return Math.round((this.game.state.codex.entries.length / CODEX_ENTRIES.length) * 100); }
  byCat() { const out = {}; for (const c of CODEX_CATS) out[c] = []; for (const e of CODEX_ENTRIES) { (out[e.cat] || (out[e.cat] = [])).push(e); } return out; }
}

/* ------------------------------------------------------------------ */
let _qseq = 1;
function makeQuest(tpl, kind) {
  return { qid: kind + "_" + tpl.id + "_" + (_qseq++), id: tpl.id, kind, name: tpl.name, ds: tpl.ds, target: tpl.target, stat: tpl.stat, reward: tpl.reward, progress: 0, done: false };
}
function weekKey(d) {
  d = d || new Date();
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const wk = Math.ceil(((t - ys) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + "W" + wk;
}
function grantQuestReward(game, reward) {
  const st = game.state, got = [];
  if (reward.gold) { st.gold += reward.gold; got.push("+" + reward.gold + " gold"); }
  if (reward.research) { st.research.points += reward.research; got.push("+" + reward.research + " research"); }
  if (reward.scrap) { st.scrap += reward.scrap; got.push("+" + reward.scrap + " scrap"); }
  if (reward.material) { st.camp.materials.metal = (st.camp.materials.metal || 0) + reward.material; got.push("+" + reward.material + " metal"); }
  if (reward.relic) { game.meta.relics.granted(reward.relic); }
  return got;
}
class QuestSystem {
  constructor(game) { this.game = game; this.refresh(); }
  refresh() {
    const q = this.game.state.quests, today = dateKey(), week = weekKey();
    if (q.dailyDate !== today || !q.daily) { q.daily = makeQuest(pick(QUEST_POOLS.daily), "daily"); q.dailyDate = today; }
    if (q.weeklyDate !== week || !q.weekly) { q.weekly = makeQuest(pick(QUEST_POOLS.weekly), "weekly"); q.weeklyDate = week; }
    // rebuild the active story list, preserving progress of still-open quests
    const doneIds = q.storyDone || [];
    const prev = {};
    for (const s of (q.story || [])) if (s && s.id) prev[s.id] = s;
    q.story = QUEST_POOLS.story
      .filter((t) => doneIds.indexOf(t.id) < 0)
      .map((t) => {
        const was = prev[t.id];
        return { qid: "story_" + t.id, id: t.id, kind: "story", name: t.name, ds: t.ds, target: t.target, stat: t.stat, reward: t.reward, progress: was ? was.progress || 0 : 0, done: false };
      });
    this.game.save();
  }
  all() { const q = this.game.state.quests; return [q.daily, q.weekly].filter(Boolean).concat(q.story || []); }
  completedStory() { return (this.game.state.quests.storyDone || []).map((id) => QUEST_POOLS.story.find((t) => t.id === id)).filter(Boolean); }
  /* called at run end - evaluates the run's stats plus cumulative records */
  recordRun(run, game) {
    const st = game.state, q = st.quests;
    const vals = {
      kills: run.kills, waves: run.wavesCleared, combo: run.combo, builds: run.builds || 0,
      killsTotal: st.totalKills, bossesTotal: st.stats.bosses || 0,
      bosses: run.bossKills, highestWave: st.highestWave, prestigeLevel: st.prestige.level,
    };
    const apply = (quest) => {
      if (!quest || quest.done) return;
      const v = vals[quest.stat] || 0;
      if (v > (quest.progress || 0)) quest.progress = v;
      if (quest.progress >= quest.target) {
        quest.done = true;
        const got = grantQuestReward(game, quest.reward);
        game.ui.toast("\u{1F4DC} Quest complete: " + quest.name + " (" + got.join(", ") + ")", "#ffce4a");
        if (quest.kind === "story" && (q.storyDone || []).indexOf(quest.id) < 0) {
          q.storyDone = (q.storyDone || []).concat(quest.id);
        }
      }
    };
    apply(q.daily); apply(q.weekly);
    for (const s of (q.story || [])) apply(s);
    q.story = (q.story || []).filter((s) => !s.done);
    game.save();
  }
  progressText(q) {
    const cur = q.done ? q.target : (q.progress || 0);
    return Math.min(cur, q.target) + " / " + q.target;
  }
}

/* ------------------------------------------------------------------ */
class BattlePassSystem {
  constructor(game) { this.game = game; }
  get p() { return this.game.state.battlePass; }
  tierForXp(xp) { let t = 0; for (const row of BATTLEPASS_TIERS) if (xp >= row.xp) t = row.tier; return t; }
  addXp(n) {
    const before = this.tierForXp(this.p.xp);
    this.p.xp += Math.max(0, Math.round(n));
    const after = this.tierForXp(this.p.xp);
    this.p.tier = after;
    if (after > before) this.game.ui.toast("\u{1F396} Battle Pass tier " + after + " reached!", "#c08bff");
    this.game.save();
  }
  claim(tier) {
    const row = BATTLEPASS_TIERS.find((r) => r.tier === tier);
    if (!row || this.p.claimed.indexOf(tier) >= 0 || this.p.xp < row.xp) return false;
    this.p.claimed.push(tier);
    const got = grantQuestReward(this.game, row.reward);
    this.game.ui.toast("\u{1F396} Tier " + tier + " claimed: " + (got.join(", ") || "reward"), "#c08bff");
    this.game.save(); return true;
  }
  mods() { return {}; }
}

/* ------------------------------------------------------------------ */
class PrestigeSystem {
  constructor(game) { this.game = game; }
  get p() { return this.game.state.prestige; }
  canPrestige() { return this.game.state.highestWave >= 20; }
  pointsFor() { return Math.max(1, Math.floor((this.game.state.highestWave - 18) / 3) + Math.floor(this.game.state.totalKills / 2500)); }
  prestige() {
    if (!this.canPrestige()) return false;
    const gain = this.pointsFor();
    const st = this.game.state;
    st.prestige.level += 1; st.prestige.points += gain;
    // soft reset: gold, shop upgrades, research and camp levels reset.
    // Career records (highest wave, kills, achievements) are NOT touched.
    st.gold = 0; st.permanentUpgrades = {};
    st.research = { nodes: ["root"], points: 1 + st.prestige.level, spent: 0 };
    st.camp.buildings = {};
    this.game.meta.recompute();
    this.game.save();
    return gain;
  }
  buy(id) {
    const mod = PRESTIGE_MODS.find((m) => m.id === id);
    if (!mod || this.p.mods.indexOf(id) >= 0 || this.p.points < mod.cost) return false;
    this.p.points -= mod.cost; this.p.mods.push(id);
    this.game.audio.sfx("upgrade"); this.game.save(); return true;
  }
  mods() { const out = {}; for (const id of this.p.mods) { const m = PRESTIGE_MODS.find((x) => x.id === id); if (m) mergeMods(out, m.mod); } return out; }
}

/* ------------------------------------------------------------------ */
class SeasonSystem {
  constructor(game) { this.game = game; }
  current() {
    const id = this.game.state.season.id || 1;
    return SEASONS.find((s) => s.id === id) || SEASONS[0];
  }
  rotate() {
    const next = ((this.game.state.season.id || 1) % SEASONS.length) + 1;
    this.game.state.season.id = next;
    this.game.state.battlePass.xp = 0; this.game.state.battlePass.tier = 0; this.game.state.battlePass.claimed = [];
    this.game.save(); return next;
  }
  noteRank(rank) {
    const order = RANKS.map((r) => r.name);
    const i = order.indexOf(rank);
    if (i > (this.game.state.season.bestRank || 0)) this.game.state.season.bestRank = i;
  }
  mods() {
    // each season grants a small themed bonus
    switch (this.game.state.season.id) {
      case 2: return { scrapGain: 1.05 };
      case 3: return { fhp: 100 };
      case 4: return { dmg: 1.05 };
      default: return {};
    }
  }
}

/* ------------------------------------------------------------------ */
/* aggregates every permanent system into one modifier bundle */
class MetaProgressionManager {
  constructor(game) {
    this.game = game;
    this.hero = new HeroSystem(game);
    this.relics = new RelicSystem(game);
    this.research = new ResearchSystem(game);
    this.camp = new CampSystem(game);
    this.survivors = new SurvivorSystem(game);
    this.codex = new CodexSystem(game);
    this.quests = new QuestSystem(game);
    this.pass = new BattlePassSystem(game);
    this.prestige = new PrestigeSystem(game);
    this.season = new SeasonSystem(game);
    this.bonus = {};
    this.recompute();
  }
  recompute() {
    const out = {};
    mergeMods(out, this.hero.mods());
    mergeMods(out, this.relics.mods());
    mergeMods(out, this.research.mods());
    mergeMods(out, this.camp.mods());
    mergeMods(out, this.survivors.mods());
    mergeMods(out, this.prestige.mods());
    mergeMods(out, this.season.mods());
    this.bonus = out;
  }
  /* award everything that happens when a run ends */
  finishRun(run, won) {
    const st = this.game.state, g = this.game;
    const hero = st.selectedHero;
    const lvl = this.hero.addXp(hero, run.wavesCleared * 12 + Math.floor(run.kills / 4) + (run.bossKills || 0) * 40);
    st.stats.runsByHero[hero] = (st.stats.runsByHero[hero] || 0) + 1;
    st.stats.favoriteHero = Object.keys(st.stats.runsByHero).sort((a, b) => st.stats.runsByHero[b] - st.stats.runsByHero[a])[0];
    st.stats.bosses = (st.stats.bosses || 0) + (run.bossKills || 0);
    st.camp.materials.metal = (st.camp.materials.metal || 0) + Math.floor(run.wavesCleared * 1.5);
    st.camp.materials.wood = (st.camp.materials.wood || 0) + Math.floor(run.wavesCleared * 1.2);
    // research points from the lab
    const rp = Math.floor(run.wavesCleared / 5) + (this.camp.level("lab") > 0 ? Math.floor(run.wavesCleared / 5) * this.camp.level("lab") : 0);
    if (rp > 0) st.research.points += rp;
    // battle pass xp
    this.pass.addXp(run.wavesCleared * 15 + Math.floor(run.kills / 3) + (won ? 200 : 0));
    // quests
    this.quests.recordRun(run, g);
    // relic from bosses
    if (run.bossKills > 0 && Math.random() < Math.min(1, run.bossKills * 0.5)) this.relics.grantRandom();
    // codex
    this.codex.unlock("p_run", "Command", "Battle Record", "Runs survive in the archive.");
    if (st.highestWave >= 20) this.codex.unlock("p_endless", "Command", "Endless", "The horde has no end.");
    if (lvl > 0) g.ui.toast("\u2b50 " + HERO_DEFS[hero].name + " reached level " + this.hero.progress(hero).level + "!", "#57e08a");
    this.recompute();
    g.save();
  }
}

/* =====================================================================
   RUN SYSTEMS (v3) - per-run variety: wave mutations, weather, synergies
   ===================================================================== */

/* rolls a mutation for every wave and applies its stat modifiers -------- */
class MutationSystem {
  constructor(game) { this.game = game; this.current = MUTATIONS[0]; }
  reset() { this.current = MUTATIONS[0]; }
  roll(wave) {
    let roll = Math.random() * MUTATIONS.reduce((a, m) => a + m.w, 0);
    for (const m of MUTATIONS) { roll -= m.w; if (roll <= 0) { this.current = m; break; } }
    // never repeat the "elite" mutation too early
    if (wave < 3 && this.current.id === "elite") this.current = MUTATIONS[0];
    return this.current;
  }
  applyToWave(n, game) {
    const m = this.current, mod = m.mod || {};
    if (mod.hp) game.waveHpMul *= mod.hp;
    if (mod.speed) game.waveSpeedMul *= mod.speed;
    if (mod.dmg) game.waveDmgMul *= mod.dmg;
    game.mutationVuln = mod.vuln || 1;
    game.mutationScrap = mod.scrap || 1;
    game.mutationMultiLane = !!mod.multiLane;
    if (m.id !== "none") {
      const colors = { horde: "#ff8093", frenzy: "#ffb347", armored: "#9aa08a", swarm: "#c06fd8", bounty: "#ffce4a", elite: "#e0526b" };
      game.ui.toast("\u2620 Mutation: " + m.name + " \u2014 " + m.ds, colors[m.id] || "#8fa2c0");
    }
    return m;
  }
}

/* picks a weather for the run and exposes its modifiers ---------------- */
class WeatherSystem {
  constructor(game) { this.game = game; this.def = WEATHER_DEFS.clear; }
  roll() {
    const ids = Object.keys(WEATHER_DEFS).filter((id) => id !== "clear");
    this.def = Math.random() < 0.55 ? WEATHER_DEFS.clear : WEATHER_DEFS[pick(ids)];
    return this.def;
  }
  get fx() { return this.def.fx || null; }
  mods() { return this.def.mod || {}; }
}

/* adjacency bonuses between neighbouring towers ------------------------- */
class SynergySystem {
  constructor(game) { this.game = game; this.active = []; this.byTower = new Map(); }
  reset() { this.active = []; this.byTower = new Map(); }
  recompute() {
    const g = this.game;
    this.active = []; this.byTower = new Map();
    const grid = new Map();
    for (const t of g.towers) if (!t.dead) grid.set(t.row + "_" + t.col, t);
    const consider = (a, b) => {
      for (const s of SYNERGIES) {
        const pair = [a.id, b.id].sort().join("+");
        const want = s.towers.slice().sort().join("+");
        if (pair !== want) continue;
        const key = [a.row, a.col, b.row, b.col].sort().join(":");
        if (this.active.some((x) => x.key === key && x.def.id === s.id)) continue;
        this.active.push({ key, def: s, a, b, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
        for (const t of [a, b]) {
          const cur = this.byTower.get(t) || {};
          mergeMods(cur, s.mod);
          this.byTower.set(t, cur);
        }
      }
    };
    for (const t of g.towers) {
      if (t.dead) continue;
      const neigh = [[t.row, t.col - 1], [t.row, t.col + 1], [t.row - 1, t.col], [t.row + 1, t.col]];
      for (const [r, c] of neigh) {
        const o = grid.get(r + "_" + c);
        if (o && t.row <= r && (t.row !== r || t.col < c)) consider(t, o);
      }
    }
    for (const t of g.towers) if (!t.dead && t.recompute) t.recompute();
  }
  modsFor(t) { return this.byTower.get(t) || {}; }
  has(id) { return this.active.some((a) => a.def.id === id); }
}

/* ---------------------------------------------------------------------
   UIMANAGER - all DOM screens, the HUD and tooltips
   --------------------------------------------------------------------- */
class UIManager {
  constructor(game) {
    this.game = game;
    this.$ = (id) => document.getElementById(id);
    this.el = {
      hud: this.$("hud"), scrap: this.$("hud-scrap"), gold: this.$("hud-gold"),
      food: this.$("hud-food"), meds: this.$("hud-meds"), wave: this.$("hud-wave"),
      waveinfo: this.$("hud-waveinfo"), ffill: this.$("ffill"), ftext: this.$("ftext"),
      fbar: this.$("fbar"), toolbar: this.$("toolbar"), skillbar: this.$("skillbar"),
      nextwrap: this.$("nextwrap"), nextcount: this.$("nextcount"), toasts: this.$("toasts"),
      menu: this.$("screen-menu"), over: this.$("screen-over"), overlay: this.$("overlay"),
      tip: this.$("tooltip"), tutorial: this.$("tutorial"), daily: this.$("dailybanner"),
      menustats: this.$("menustats"), btnMusic: this.$("btn-music"), btnSfx: this.$("btn-sfx"),
      btnEndless: this.$("btn-endless"),
    };
    this.lastToolbarSig = "";
    this.lastSkillSig = "";
    this.tipEl = null;
  }

  /* ---------------- toasts + tooltips ---------------- */
  toast(msg, color) {
    const d = document.createElement("div");
    d.className = "toast";
    d.textContent = I18N.tr(msg);
    if (color) d.style.color = color;
    this.el.toasts.appendChild(d);
    setTimeout(() => { d.style.transition = "opacity .4s"; d.style.opacity = "0"; }, 2600);
    setTimeout(() => d.remove(), 3100);
  }
  showTip(target, html) {
    const t = this.el.tip;
    t.innerHTML = I18N.tr(html);
    t.classList.remove("hidden");
    const r = target.getBoundingClientRect(), s = this.game.stageRect();
    let x = (r.left - s.left) / s.scale + r.width / 2;
    let y = (r.top - s.top) / s.scale - 10;
    t.style.left = "0px"; t.style.top = "0px";
    const tw = t.offsetWidth, th = t.offsetHeight;
    t.style.left = clamp(x - tw / 2, 6, W - tw - 6) + "px";
    t.style.top = (y - th > 0 ? y - th : y + r.height / s.scale + 18) + "px";
  }
  hideTip() { this.el.tip.classList.add("hidden"); }

  /* ---------------- HUD ---------------- */
  showHud(on) { this.el.hud.classList.toggle("hidden", !on); }
  updateHUD() {
    const g = this.game, f = g.fortress;
    if (!f) return;
    this.el.scrap.textContent = fmt(g.scrap);
    this.el.gold.textContent = fmt(g.state.gold);
    this.el.food.textContent = fmt(g.food);
    this.el.meds.textContent = fmt(g.meds);
    const wm = g.waves;
    const alive = g.zombies.filter((z) => !z.dead).length;
    const shownWave = wm.active ? wm.wave : Math.max(1, wm.wave + 1);
    this.el.wave.textContent = T((g.endless && shownWave >= 20 ? "\u221E " : "") + "Wave " + shownWave);
    if (!wm.active) this.el.waveinfo.textContent = T("Build phase \u2014 " + Math.ceil(wm.prepTimer) + "s until next wave");
    else this.el.waveinfo.textContent = T(wm.doneSpawning ? alive + " zombie" + (alive === 1 ? "" : "s") + " left" : Math.max(0, wm.total - wm.spawned) + " incoming");
    const pct = f.pct * 100;
    this.el.ffill.style.width = pct + "%";
    this.el.ftext.textContent = T("Fortress " + Math.ceil(f.hp) + " / " + Math.round(f.maxHp));
    this.el.fbar.classList.toggle("low", pct < 35);
    // next-wave button
    this.el.nextwrap.classList.toggle("hidden", wm.active);
    if (!wm.active) {
      this.el.nextcount.textContent = T("Auto-starts in " + Math.ceil(wm.prepTimer) + "s  \u00b7  call early for bonus scrap");
    }
    this.syncToolbar(); this.syncSkills();
  }
  syncToolbar() {
    const g = this.game;
    const sig = TOWER_IDS.map((id) => {
      const unlocked = g.state.unlockedTowers.includes(id);
      return id + (unlocked ? "1" : "0") + (g.selectedTower === id ? "S" : "") + (g.scrap >= g.towerCost(id) ? "A" : "B");
    }).join("|");
    if (sig === this.lastToolbarSig) return;
    this.lastToolbarSig = sig;
    this.el.toolbar.innerHTML = "";
    for (const id of TOWER_IDS) {
      const def = TOWER_DEFS[id];
      const cost = g.towerCost(id);
      const unlocked = g.state.unlockedTowers.includes(id);
      const card = document.createElement("div");
      card.className = "tcard" + (g.selectedTower === id ? " sel" : "") + (!unlocked ? " locked" : "") + (unlocked && g.scrap < cost ? " poor" : "");
      card.dataset.tower = id;
      card.dataset.tip = I18N.tr(unlocked
        ? `<b>${def.name}</b><br>${def.desc}<br>Cost: <b>${cost}</b> scrap${def.kind === "block" ? "<br>HP: " + def.base.hp : ""}`
        : `<b>${def.name}</b> (locked)<br>Unlock in Collection for <b>${def.unlockCost}</b> gold.`);
      card.innerHTML = `<canvas width="52" height="52"></canvas><div class="nm">${I18N.tr(def.name.split(" ")[0])}</div>` +
        (unlocked ? `<div class="cst">${cost}</div>` : `<div class="lock">\u{1F512}</div>`);
      this.el.toolbar.appendChild(card);
      drawTowerGlyph(card.querySelector("canvas"), def, !unlocked);
    }
  }
  syncSkills() {
    const g = this.game;
    const sig = g.skills.map((s) => s.id + Math.ceil(s.cdLeft) + (g.selectedSkill === s.id ? "S" : "") + (g.skillUsable(s) ? "A" : "B")).join("|");
    if (sig === this.lastSkillSig) return;
    this.lastSkillSig = sig;
    this.el.skillbar.innerHTML = "";
    for (const s of g.skills) {
      const b = document.createElement("div");
      const ready = g.skillUsable(s);
      b.className = "sk" + (g.selectedSkill === s.id ? " sel" : "") + (ready ? "" : " disabled");
      b.dataset.skill = s.id;
      b.dataset.tip = I18N.tr(`<b>${s.name}</b><br>${s.desc}<br>Cost: <b>${s.cost}</b> ${s.costType === "food" ? "food" : "meds"} \u00b7 cooldown ${s.cd}s`);
      b.innerHTML = `<div class="ico">${s.icon}</div><div class="nm">${I18N.tr(s.name)}</div><div class="cost">${s.cost} ${s.costType === "food" ? "\u{1F35E}" : "\u{1F48A}"}</div>` +
        (s.cdLeft > 0 ? `<div class="cdmask">${Math.ceil(s.cdLeft)}</div>` : "");
      this.el.skillbar.appendChild(b);
    }
  }

  /* ---------------- screens ---------------- */
  hideScreens() {
    this.el.menu.classList.add("hidden");
    this.el.over.classList.add("hidden");
  }
  showMenu() {
    this.hideScreens(); this.closeOverlay();
    this.el.menu.classList.remove("hidden");
    this.buildMenu();
    this.game.setMusic("menu");
  }
  buildMenu() {
    const g = this.game, st = g.state;
    const r = rankFor(g.score());
    this.el.menustats.innerHTML = I18N.tr(
      `<span class="chip rankchip">Rank: <b style="color:${r.color}">${r.name}</b></span>` +
      `<span class="chip">Best Wave <b>${st.highestWave}</b></span>` +
      `<span class="chip">Total Kills <b>${fmt(st.totalKills)}</b></span>` +
      `<span class="chip">High Score <b>${fmt(st.highScore)}</b></span>` +
      `<span class="chip">Played <b>${hhmmss(st.totalPlayTime)}</b></span>` +

    const dr = g.daily;

    if (dr.rewardAvailable) {
      this.el.daily.innerHTML = I18N.tr(`\u{1F381} <b>Daily login reward ready</b> \u2014 Day ${dr.streak} streak \u00b7 +${30 + dr.streak * 12} gold. &nbsp;<span class="dim">(click to claim)</span>`);

      this.el.daily.innerHTML = I18N.tr(`\u{1F4C5} <b>Daily challenge:</b> ${c.name} \u2014 ${c.ds}` +

  openOverlay(html) { this.el.overlay.innerHTML = I18N.tr(html); this.el.overlay.classList.add("hidden"); this.el.overlay.firstElementChild && this.el.overlay.firstElementChild.classList.add("ovl"); }

      `<div class="c"><div class="v">${fmt(info.score)}</div><div class="k">${T("Score")}</div></div>` +
      `<div class="c"><div class="v">${fmt(info.kills)}</div><div class="k">${T("Kills")}</div></div>` +
      `<div class="c"><div class="v">${fmt(info.best)}</div><div class="k">${T("Best score")}</div></div>` +
      `<div class="c"><div class="v">${st.highestWave}</div><div class="k">${T("Best wave")}</div></div>`;
    this.setMusicSafe("gameover");
  }
  setMusicSafe(kind) { try { this.game.setMusic(kind); } catch (e) {} }

  /* tower panel for a selected built tower */  towerPanel(t) {
    const g = this.game;
    const upCost = t.upgradeCost(), sell = t.sellValue();
    const maxed = !t.canUpgrade();
    const stat = (k, v) => `<div class="up center"><div class="k dim">${k}</div><div style="font-size:19px;font-weight:800">${v}</div></div>`;
    let stats = "";
    if (t.kind === "block") stats = stat("Wall HP", Math.ceil(t.maxHp));
    else if (t.kind === "heal") stats = stat("Heal / s", t.heal.toFixed(1));
    else stats = stat("Damage", t.kind === "flame" ? t.dmg.toFixed(1) + "/tick" : Math.round(t.dmg)) + stat("Range", Math.round(t.range)) + stat("Fire / s", t.rate.toFixed(2));
    this.setOverlayContent(`<div class="head"><h2>${t.def.name} \u00b7 Lv ${t.level}</h2><button class="btn sm ghost" data-action="close">Back</button></div>
      <div class="dim" style="margin-bottom:12px">${t.def.desc}</div>
      <div class="grid3">${stats}</div>
      <div class="row" style="margin-top:16px;gap:10px">
        <button class="btn primary" data-action="upgradetower" ${maxed || g.scrap < upCost ? "disabled" : ""}>
          ${maxed ? "MAX LEVEL" : `Upgrade \u00b7 ${upCost} scrap`}</button>
        <button class="btn danger" data-action="selltower">Sell \u00b7 +${sell} scrap</button>
      </div>`);
  }
}
