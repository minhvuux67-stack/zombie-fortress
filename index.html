<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Zombie Fortress: Pandemic Defense</title>
<meta name="description" content="Hold the last fortress. Build towers, survive the pandemic. A free HTML5 tower-defense survival game.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b14'/%3E%3Cpath d='M6 23V12l4-3 4 3 4-3 4 3v11z' fill='%2357e08a'/%3E%3Ccircle cx='13' cy='16' r='1.9' fill='%23070b14'/%3E%3Ccircle cx='19' cy='16' r='1.9' fill='%23070b14'/%3E%3C/svg%3E">
<style>

:root{
  --bg:#070b14; --bg2:#0b1220; --panel:rgba(18,26,44,.72); --panel-line:rgba(120,160,220,.18);
  --txt:#dfe8f6; --dim:#8fa2c0; --accent:#57e08a; --accent2:#4aa8ff; --danger:#ff5566; --gold:#ffce4a;
  --scrap:#8fd3ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:none}
body{user-select:none;-webkit-user-select:none}
#stage{position:absolute;width:1280px;height:720px;transform-origin:top left;overflow:hidden;
  background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.8)}
canvas#game{position:absolute;inset:0;width:1280px;height:720px;display:block}

/* ---------- generic ui ---------- */
.hidden{display:none !important}
.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--panel-line);border-radius:10px;
  background:linear-gradient(180deg,rgba(52,72,110,.85),rgba(28,40,64,.9));color:var(--txt);
  padding:8px 14px;transition:transform .08s,filter .12s,border-color .12s;letter-spacing:.2px}
.btn:hover{filter:brightness(1.18);border-color:rgba(140,190,255,.45)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.primary{background:linear-gradient(180deg,#49d07c,#22854a);border-color:#58e08e;color:#06140c;
  box-shadow:0 4px 18px rgba(70,220,130,.28)}
.btn.danger{background:linear-gradient(180deg,#e0556a,#8e2334);border-color:#ff8093;color:#fff}
.btn.ghost{background:rgba(255,255,255,.05)}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.5)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.lg{padding:12px 26px;font-size:19px;border-radius:13px}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1}
.dim{color:var(--dim)}
.center{text-align:center}
h1,h2,h3{margin:0}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 50% 30%,rgba(30,50,90,.55),rgba(4,7,14,.94));
  animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.screen .box{width:1080px;max-height:684px;padding:22px 26px;overflow:hidden;display:flex;flex-direction:column}
.screen h2{font-size:30px;letter-spacing:.5px}
.screen .sub{color:var(--dim);font-size:13px;margin-top:2px}

#screen-menu .box{width:900px;text-align:center;align-items:center;padding:34px 40px}
.logo{font-size:58px;font-weight:900;letter-spacing:2px;line-height:.95;
  background:linear-gradient(180deg,#d9ffe9,#3fd07f 55%,#1d9a5c);-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 6px 24px rgba(60,220,140,.35))}
.logo small{display:block;font-size:17px;font-weight:700;letter-spacing:6px;color:#8fd3ff;
  -webkit-text-fill-color:#8fd3ff;filter:none;margin-top:8px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:22px}
.menu-grid .btn{padding:13px 10px;font-size:16px}
.menu-grid .btn.wide{grid-column:span 3}
.statbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chip{background:rgba(255,255,255,.06);border:1px solid var(--panel-line);border-radius:999px;
  padding:6px 13px;font-size:13px}
.chip b{color:#fff}
.rankchip{background:linear-gradient(90deg,rgba(255,206,74,.18),rgba(255,206,74,.04));border-color:rgba(255,206,74,.45)}
.mutebar{position:absolute;top:14px;right:16px;display:flex;gap:8px;z-index:20}

/* ---------- hud ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud .clickable{pointer-events:auto}
.topbar{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:8px}
.res{display:flex;gap:8px}
.res .stat{background:var(--panel);border:1px solid var(--panel-line);border-radius:11px;padding:6px 11px;
  font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px;backdrop-filter:blur(10px)}
.res .stat .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
#hud .wavebox{margin-left:auto;text-align:right;background:var(--panel);border:1px solid var(--panel-line);
  border-radius:11px;padding:5px 14px;backdrop-filter:blur(10px);min-width:190px}
#hud .wavebox #hud-wave{font-weight:800;font-size:17px}
#hud .wavebox #hud-waveinfo{font-size:11.5px;color:var(--dim)}
.fortressbar{position:absolute;top:64px;left:12px;width:300px;height:16px;border-radius:9px;overflow:hidden;
  background:rgba(0,0,0,.55);border:1px solid var(--panel-line)}
.fortressbar>div{height:100%;width:100%;background:linear-gradient(90deg,#49d07c,#9bf0b6);transition:width .18s}
.fortressbar.low>div{background:linear-gradient(90deg,#ff5566,#ff9aa5)}
.fortressbar .lbl{position:absolute;inset:0;font-size:11px;font-weight:800;text-align:center;line-height:16px;
  text-shadow:0 1px 3px #000}

#toolbar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end}
.tcard{width:86px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 5px 5px;
  text-align:center;cursor:pointer;backdrop-filter:blur(10px);position:relative;transition:transform .1s,border-color .12s}
.tcard:hover{transform:translateY(-3px)}
.tcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(87,224,138,.4),0 6px 22px rgba(0,0,0,.5)}
.tcard.locked{opacity:.55;filter:grayscale(.7)}
.tcard.poor{opacity:.5}
.tcard canvas{width:52px;height:52px;display:block;margin:0 auto}
.tcard .nm{font-size:11px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .cst{font-size:11px;color:var(--scrap);font-weight:700}
.tcard .lock{position:absolute;top:4px;right:5px;font-size:12px}

#skillbar{position:absolute;bottom:10px;right:12px;display:flex;gap:8px}
.sk{width:74px;height:66px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;
  cursor:pointer;position:relative;backdrop-filter:blur(10px);text-align:center;padding-top:6px;
  transition:transform .1s,border-color .12s}
.sk:hover{transform:translateY(-3px)}
.sk.sel{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(74,168,255,.4)}
.sk .ico{font-size:23px;line-height:1}
.sk .nm{font-size:10px;font-weight:700;margin-top:2px}
.sk .cost{font-size:10px;color:var(--gold)}
.sk .cdmask{position:absolute;inset:0;background:rgba(2,6,14,.72);border-radius:11px;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:19px}
.sk.disabled{opacity:.5;filter:grayscale(.6)}

#nextwrap{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);text-align:center}
#nextwrap .cnt{font-size:12px;color:var(--dim);margin-top:4px}
.pill{display:inline-block;background:rgba(0,0,0,.5);border:1px solid var(--panel-line);border-radius:999px;
  padding:3px 10px;font-size:12px}

#toasts{position:absolute;top:132px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:7px 15px;font-size:14px;
  backdrop-filter:blur(10px);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#tutorial{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:22px;
  font-weight:700;text-shadow:0 3px 18px #000;transition:opacity 1s;pointer-events:none}

/* ---------- overlays ---------- */
.ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,7,14,.94);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fade .2s ease;z-index:30}
.ovl .box{width:820px;max-height:640px;padding:20px 24px;display:flex;flex-direction:column}
.ovl .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.scroll{overflow-y:auto;overscroll-behavior:contain;padding-right:6px;flex:1}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:rgba(120,160,220,.3);border-radius:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.up{background:rgba(255,255,255,.045);border:1px solid var(--panel-line);border-radius:12px;padding:10px 12px}
.up.on{border-color:rgba(87,224,138,.55);background:rgba(87,224,138,.09)}
.up .nm{font-weight:700;font-size:14px}
.up .ds{font-size:11.5px;color:var(--dim);margin:2px 0 8px}
.up .lv{font-size:12px;color:var(--accent);font-weight:700}
.ac{display:flex;gap:11px;align-items:center;background:rgba(255,255,255,.045);border:1px solid var(--panel-line);
  border-radius:12px;padding:9px 12px}
.ac.on{border-color:rgba(87,224,138,.55);background:rgba(87,224,138,.09)}
.ac .ic{font-size:24px;width:30px;text-align:center}
.ac .nm{font-weight:700;font-size:14px}
.ac .ds{font-size:11.5px;color:var(--dim)}
.ac .dt{font-size:11px;color:var(--accent)}
.towercard{background:rgba(255,255,255,.045);border:1px solid var(--panel-line);border-radius:12px;padding:10px;
  display:flex;gap:11px;align-items:center}
.towercard.locked{opacity:.62}
.towercard canvas{width:58px;height:58px;flex:none}
.towercard .nm{font-weight:800;font-size:15px}
.towercard .ds{font-size:11.5px;color:var(--dim)}
table.lb{width:100%;border-collapse:collapse;font-size:14px}
table.lb th,table.lb td{padding:7px 9px;text-align:left;border-bottom:1px solid rgba(120,160,220,.13)}
table.lb th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
table.lb tr.me td{color:var(--accent);font-weight:700}

/* ---------- gameover ---------- */
#screen-over .box{width:720px;text-align:center;align-items:center;padding:30px 40px}
#screen-over h2{font-size:44px;letter-spacing:2px;color:var(--danger)}
#screen-over .bignum{font-size:64px;font-weight:900;color:var(--gold);line-height:1}
.tease{background:rgba(255,206,74,.1);border:1px solid rgba(255,206,74,.4);border-radius:12px;padding:9px 16px;
  margin:12px 0;font-size:15px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin:14px 0}
.kv .c{background:rgba(255,255,255,.05);border-radius:10px;padding:9px 6px}
.kv .v{font-size:23px;font-weight:800}
.kv .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.pausebox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,6,13,.72);z-index:25}
.pausebox .panel{padding:26px 40px;text-align:center}
.tip{position:absolute;pointer-events:none;background:rgba(6,12,22,.95);border:1px solid var(--panel-line);
  border-radius:9px;padding:7px 10px;font-size:12px;max-width:250px;z-index:40;line-height:1.45;
  box-shadow:0 8px 26px rgba(0,0,0,.5)}
.tip b{color:var(--accent)}

/* portrait phones: nudge the player to rotate (the field is 16:9) */
#rotate{display:none;position:absolute;inset:0;z-index:60;align-items:center;justify-content:center;
  background:rgba(4,7,14,.96);color:#cfe0ff;font-size:20px;font-weight:700;text-align:center;padding:24px}
@media (orientation:portrait) and (pointer:coarse) and (max-width:900px){ #rotate{display:flex} }

/* ---------- pixel-art loading screen ---------- */
#loadscreen{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  background:#0a0710;transition:opacity .45s ease}
#loadscreen.done{opacity:0}
#loadscreen .loadinner{padding:30px 46px;text-align:center;min-width:420px}
#loadscreen .loadtitle{font-size:30px;font-weight:900;letter-spacing:5px;color:#e8f0ff;
  text-shadow:0 3px 0 #6b1a24,0 0 22px rgba(224,67,79,.7)}
#loadscreen .loadtitle small{display:block;font-size:12px;letter-spacing:7px;color:#ff9aa8;margin-top:6px;font-weight:700}
#loadscreen .loadbar{margin-top:22px;height:18px;background:#120d1a;border:2px solid #2c2438;
  box-shadow:inset 0 0 0 2px #0a0710;overflow:hidden}
#loadscreen .loadbar>div{height:100%;width:0;background:repeating-linear-gradient(90deg,#57e08a 0 10px,#3fb36c 10px 20px);
  transition:width .12s linear}
#loadscreen .loadpct{margin-top:12px;font-size:12px;letter-spacing:3px;color:#8fa2c0}
</style>
</head>

<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>

  <!-- ============ IN-GAME HUD ============ -->
  <div id="hud" class="hidden">
    <div class="topbar">
      <div class="res clickable">
        <div class="stat" id="stat-scrap" title="Scrap - earned from zombie kills, used to build and upgrade towers">
          <span class="dot" style="background:var(--scrap)"></span><span id="hud-scrap">0</span></div>
        <div class="stat" id="stat-gold" title="Gold - earned at the end of each wave, spent on permanent upgrades">
          <span class="dot" style="background:var(--gold)"></span><span id="hud-gold">0</span></div>
        <div class="stat" id="stat-food" title="Food - powers Airstrike and Freeze">
          <span class="dot" style="background:#7ee08a"></span><span id="hud-food">0</span></div>
        <div class="stat" id="stat-meds" title="Meds - powers Repair">
          <span class="dot" style="background:#ff7d9c"></span><span id="hud-meds">0</span></div>
      </div>
      <div class="wavebox">
        <div id="hud-wave">Wave 1</div>
        <div id="hud-waveinfo">Get ready</div>
      </div>
      <button class="btn ghost clickable" data-action="pause" title="Pause (P)">II</button>
      <button class="btn ghost clickable" data-action="help" title="How to play">?</button>
    </div>
    <div class="fortressbar" id="fbar"><div id="ffill"></div><div class="lbl" id="ftext">Fortress 100%</div></div>

    <div id="nextwrap" class="clickable">
      <button class="btn primary lg" data-action="nextwave">Next Wave <span id="nexticon">&#9656;</span></button>
      <div class="cnt" id="nextcount"></div>
    </div>

    <div id="toolbar" class="clickable"></div>
    <div id="skillbar" class="clickable"></div>
    <div id="toasts"></div>
    <div id="tutorial" class="hidden">Tap a slot to build. Towers fire on their own. Survive the waves!</div>
  </div>

  <!-- ============ MAIN MENU ============ -->
  <div id="screen-menu" class="screen">
    <div class="box panel">
      <div class="logo">ZOMBIE FORTRESS<small>PANDEMIC DEFENSE</small></div>
      <div id="dailybanner" class="tease" style="margin-top:18px"></div>
      <div class="menu-grid">
        <button class="btn primary wide lg" data-action="play">&#9654; PLAY</button>
        <button class="btn" data-action="shop">&#9881; Upgrade Shop</button>
        <button class="btn" data-action="collection">&#127993; Collection</button>
        <button class="btn" data-action="achievements">&#127942; Achievements</button>
        <button class="btn" data-action="heroes">&#129489; Heroes</button>
        <button class="btn" data-action="relics">&#128142; Relics</button>
        <button class="btn" data-action="research">&#129514; Research</button>
        <button class="btn" data-action="camp">&#127957; Camp</button>
        <button class="btn" data-action="quests">&#128220; Quests</button>
        <button class="btn" data-action="codex">&#128214; Codex</button>
        <button class="btn" data-action="battlepass">&#127894; Battle Pass</button>
        <button class="btn" data-action="prestige">&#11088; Prestige</button>
        <button class="btn" data-action="season">&#127761; Season</button>
        <button class="btn" data-action="daily">&#128197; Daily Challenge</button>
        <button class="btn" data-action="endless" id="btn-endless">&#8734; Endless Mode</button>
        <button class="btn" data-action="leaderboard">&#128202; Leaderboard</button>
        <button class="btn" data-action="settings">&#9881; Settings</button>
        <button class="btn" data-action="help">&#10067; How to Play</button>
        <button class="btn" data-action="donate">&#10084; Support the Author</button>
      </div>
      <div class="statbar" id="menustats"></div>
    </div>
    <div class="mutebar">
      <button class="btn ghost sm" data-action="togglemusic" id="btn-music" title="Toggle music">&#9834;</button>
      <button class="btn ghost sm" data-action="togglesfx" id="btn-sfx" title="Toggle sound effects">&#128266;</button>
    </div>
  </div>

  <!-- ============ GAME OVER ============ -->
  <div id="screen-over" class="screen hidden">
    <div class="box panel">
      <h2>FORTRESS FALLEN</h2>
      <div class="dim" id="over-sub">The pandemic claimed another bunker.</div>
      <div class="bignum" id="over-wave">Wave 0</div>
      <div class="dim" style="font-size:12px;letter-spacing:2px">WAVE REACHED</div>
      <div class="tease" id="over-tease"></div>
      <div class="kv" id="over-kv"></div>
      <div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn primary lg" data-action="retry">&#8635; Retry Now</button>
        <button class="btn" data-action="shop">Upgrade Shop</button>
        <button class="btn" data-action="leaderboard">Leaderboard</button>
        <button class="btn ghost" data-action="menu">Main Menu</button>
        <button class="btn ghost" data-action="donate">&#10084; Support</button>
      </div>
    </div>
  </div>

  <div id="overlay"></div>
  <div id="tooltip" class="tip hidden"></div>
  <div id="rotate">&#8635;&nbsp; Rotate your device to landscape</div>
</div>

/* short all-caps states replaced only when the whole node matches */
const I18N_WHOLE = {
  "ON": "BẬT", "OFF": "TẮT", "MAXED": "TỐI ĐA", "READY": "SẴN SÀNG",
  "LOADING 0%": "ĐANG TẢI 0%",
};

const I18N_TITLE = {
  en: "Zombie Fortress: Pandemic Defense",
  vi: "Pháo đài Zombie: Phòng thủ đại dịch",
};

const I18N = {
  lang: "en",
  _exact: null,
  _list: null,
  _started: false,

  init(lang) {
    const list = I18N_PAIRS.slice().sort((a, b) => b[0].length - a[0].length);
    this._exact = {};
    this._list = [];
    for (const [en, vi] of list) {
      this._exact[en] = vi;
      const esc = en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      this._list.push({ en, vi, re: new RegExp("(?<![A-Za-z])" + esc + "(?![A-Za-z])", "g") });
    }
    this.setLang(lang || "en");
  },

  setLang(lang) {
    this.lang = lang === "vi" ? "vi" : "en";
    if (typeof document !== "undefined" && document.getElementById) {
      const stage = document.getElementById("stage");
      if (stage) this.walk(stage);
    }
    if (typeof document !== "undefined") {
      document.documentElement.setAttribute("lang", this.lang);
      document.title = I18N_TITLE[this.lang] || I18N_TITLE.en;
      const meta = document.querySelector('meta[name="description"]');
      if (meta) {
        meta.setAttribute("content", this.lang === "vi"
          ? "Giữ vững pháo đài cuối cùng. Xây trụ, sống sót qua đại dịch. Game thủ thành sinh tồn HTML5 miễn phí."
          : "Hold the last fortress. Build towers, survive the pandemic. A free HTML5 tower-defense survival game.");
      }
    }
  },

  /* translate one string (never returns null) */
  tr(text) {
    if (this.lang !== "vi" || !text) return text;
    const s = String(text);
    if (this._exact[s] !== undefined) return this._exact[s];
    const whole = I18N_WHOLE[s.trim()];
    if (whole && s === s.trim()) return whole;
    let out = s;
    for (const e of this._list) {
      if (out.indexOf(e.en) >= 0) out = out.replace(e.re, e.vi);
    }
    return out;
  },

  /* translate + remember original so a language switch can restore */
  _walkNode(node) {
    const cur = node.nodeValue;
    if (cur == null) return;
    let src = node.__i18nSrc;
    if (cur !== node.__i18nOut) src = cur;
    if (src == null || src === "") return;
    let out = this.tr(src);
    if (out === src && src === cur) { node.__i18nSrc = src; node.__i18nOut = out; return; }
    node.__i18nSrc = src;
    node.__i18nOut = out;
    if (out !== cur) node.nodeValue = out;
  },

  _walkAttrs(el) {
    if (!el.getAttribute) return;
    for (const a of ["title", "placeholder", "aria-label"]) {
      const v = el.getAttribute(a);
      if (!v) continue;
      const key = "__i18n_" + a + "Src";
      const outKey = "__i18n_" + a + "Out";
      let src = el[key];
      if (v !== el[outKey]) src = v;
      if (src == null || src === "") continue;
      const out = this.tr(src);
      el[key] = src; el[outKey] = out;
      if (out !== v) el.setAttribute(a, out);
    }
  },

  walk(root) {
    if (!this._list) return;
    const start = root || document.getElementById("stage") || document.body;
    if (!start) return;
    const tw = document.createTreeWalker(start, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => {
        const p = n.parentNode && n.parentNode.nodeName;
        if (p === "SCRIPT" || p === "STYLE") return NodeFilter.FILTER_REJECT;
        return n.nodeValue && n.nodeValue.length ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
      },
    });
    let n;
    while ((n = tw.nextNode())) this._walkNode(n);
    if (start.querySelectorAll) start.querySelectorAll("[title],[placeholder],[aria-label]").forEach((el) => this._walkAttrs(el));
    if (start.getAttribute) this._walkAttrs(start);
  },

  start() {
    if (this._started) return;
    this._started = true;
    const tick = () => this.walk();
    setTimeout(tick, 60);
    setInterval(tick, 250);
  },
};

function T(s) { return I18N.tr(s); }

/* =====================================================================
   ART / ASSET LAYER
   Preloads every pixel-art PNG + audio sample listed in ASSET_MANIFEST
   and exposes helpers used by the renderer.  If a sprite is missing the
   game falls back to the original vector drawing, so it never breaks.
   ===================================================================== */

/* ASSET_MANIFEST is injected by the build step (external paths for the
   full itch build, data: URIs for the single-file / min build). */

const ART = {
  ready: false,
  images: {},
  loaded: 0,
  total: 0,
  failed: 0,
  has(key) { return !!this.images[key]; },
  img(key) { return this.images[key]; },
  /* every audio key that was loaded (sfx/... and music/...) */
  audioURL(key) { return ASSET_MANIFEST[key]; },
};

class AssetLoader {
  constructor(manifest) {
    this.manifest = manifest || {};
    this.keys = Object.keys(this.manifest).filter((k) => k.indexOf("sfx/") !== 0 && k.indexOf("music/") !== 0);
  }
  load(onProgress, onDone) {
    const keys = this.keys;
    const total = keys.length || 1;
    ART.total = keys.length;
    let done = 0;
    const tick = () => {
      ART.loaded = done;
      if (onProgress) onProgress(done, keys.length);
      if (done >= keys.length) { ART.ready = true; if (onDone) onDone(); }
    };
    if (!keys.length) { ART.ready = true; tick(); return; }
    for (const k of keys) {
      const im = new Image();
      im.onload = () => { ART.images[k] = im; done++; tick(); };
      im.onerror = () => { ART.failed++; done++; tick(); };
      im.decoding = "async";
      im.src = this.manifest[k];
    }
  }
}

const ZS = { fw: 48, fh: 48, cols: 8 };
const ZOMBIE_ANIM = {
  idle:   { row: 0, frames: 4, fps: 5 },
  walk:   { row: 1, frames: 8, fps: 9 },
  attack: { row: 2, frames: 6, fps: 13 },
  hurt:   { row: 3, frames: 2, fps: 9 },
  death:  { row: 4, frames: 8, fps: 11 },
  spawn:  { row: 5, frames: 4, fps: 8 },
};

/* draw one frame of a sprite sheet, centred on (cx,cy) */
function artFrame(ctx, key, col, row, fw, fh, cx, cy, w, h, flip) {
  const im = ART.images[key];
  if (!im) return false;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flip) {
    ctx.translate(cx, cy); ctx.scale(-1, 1);
    ctx.drawImage(im, col * fw, row * fh, fw, fh, -w / 2, -h / 2, w, h);
  } else {
    ctx.drawImage(im, col * fw, row * fh, fw, fh, cx - w / 2, cy - h / 2, w, h);
  }
  ctx.restore();
  return true;
}

/* draw a whole single-frame sprite (no sheet slicing) */
function artImage(ctx, key, cx, cy, w, h, flip) {
  const im = ART.images[key];
  if (!im) return false;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flip) { ctx.translate(cx, cy); ctx.scale(-1, 1); ctx.drawImage(im, -w / 2, -h / 2, w, h); }
  else ctx.drawImage(im, cx - w / 2, cy - h / 2, w, h);
  ctx.restore();
  return true;
}

/* helper for DOM image URLs (menu splash, icons) */
function artURL(key) { return ASSET_MANIFEST[key] || ""; }

  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }

/* deep-merge a loaded save over the defaults so older saves gain v3 keys */
function normalizeState(data) {

  st.settings = Object.assign(defaultState().settings, (data && data.settings) || {});
  // English is always the default; only keep Vietnamese when it was chosen in Settings
  if (st.settings.lang !== "vi") st.settings.lang = "en";
  const arr = (v, fb) => (Array.isArray(v) ? v : fb);
  st.unlockedTowers = Array.isArray(data && data.unlockedTowers) && data.unlockedTowers.length ? data.unlockedTowers : base.unlockedTowers;
  st.achievements = arr(data && data.achievements, []);
  st.leaderboard = arr(data && data.leaderboard, []);

  st.survivors.recruited = arr(st.survivors.recruited, []);
  st.codex = Object.assign({}, base.codex, (data && data.codex) || {});
  st.codex.entries = arr(st.codex.entries, base.codex.entries);
  st.quests = Object.assign({}, base.quests, (data && data.quests) || {});
  st.quests.story = arr(st.quests.story, []);
  st.quests.storyDone = arr(st.quests.storyDone, []);

  const legacyStoryIds = st.quests.story.filter((x) => typeof x === "string");
  if (legacyStoryIds.length) {

class SaveSystem {
  static load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && typeof data === "object") return normalizeState(data);
      }
    } catch (e) {}
    // main save missing or corrupt - fall back to the rolling backup
    try {
      const raw = localStorage.getItem(SAVE_BACKUP_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && typeof data === "object") return normalizeState(data);
      }
    } catch (e) {}
    return defaultState();
  }
  static save(st) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); return true; }
    catch (e) { return false; }
  }
  static saveBackup(st) {
    try { localStorage.setItem(SAVE_BACKUP_KEY, JSON.stringify(st)); return true; }
    catch (e) { return false; }
  }
  static loadBackup() {
    try {
      const raw = localStorage.getItem(SAVE_BACKUP_KEY);
      if (raw) { const d = JSON.parse(raw); if (d && typeof d === "object") return normalizeState(d); }
    } catch (e) {}
    return null;
  }
  static wipe() {
    try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_BACKUP_KEY); } catch (e) {}
  }
}

/* ---------------------------------------------------------------------
   AUDIOSYSTEM - every sound is synthesised live with the WebAudio API.
   No audio files, no network. Music is a tiny step sequencer.
   --------------------------------------------------------------------- */
class AudioSystem {
  constructor(state) {
    this.state = state;
    this.ctx = null;
    this.master = null; this.musicBus = null; this.sfxBus = null;
    this.noiseBuf = null;
    this.musicOn = state.settings.musicOn !== false;
    this.sfxOn = state.settings.soundOn !== false;
    this.playing = false; this.track = null;
    this.step = 0; this.nextTime = 0; this.timer = null;
    this.tempo = 0.135; // seconds per 16th step
    this.samples = null;         // generated SFX / music elements (optional)
    this.musicEl = null; this._musicKey = null;
  }

  /* preload the generated .ogg samples listed in the asset manifest */
  loadSamples() {
    if (this.samples || typeof Audio === "undefined" || !ASSET_MANIFEST) return;
    this.samples = {};
    for (const k in ASSET_MANIFEST) {
      if (k.indexOf("sfx/") === 0 || k.indexOf("music/") === 0) {
        const a = new Audio();
        a.preload = "auto";
        a.src = ASSET_MANIFEST[k];
        this.samples[k] = a;
      }
    }
  }
  /* some game events have no matching generated file - alias them */
  static get SFX_ALIAS() {
    return { build: "place", zeath: "zombie_die", repair: "heal", lose: "gameover" };
  }

  init() {
    if (this.ctx) { this.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = this.musicOn ? 0.5 : 0;
      this.musicBus.connect(this.master);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = this.sfxOn ? 0.85 : 0;
      this.sfxBus.connect(this.master);
      // reusable white-noise buffer
      const len = this.ctx.sampleRate * 1.2;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.resume();
    } catch (e) { this.ctx = null; }
  }
  resume() { if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => {}); }
  setMusic(on) {
    this.musicOn = on; this.state.settings.musicOn = on;
    if (this.musicEl) this.musicEl.volume = on ? 0.5 : 0;
    if (this.musicBus && this.ctx) this.musicBus.gain.setTargetAtTime(on ? 0.5 : 0, this.ctx.currentTime, 0.05);
  }
  setSFX(on) {
    this.sfxOn = on; this.state.settings.soundOn = on;
    if (this.sfxBus && this.ctx) this.sfxBus.gain.setTargetAtTime(on ? 0.85 : 0, this.ctx.currentTime, 0.02);
  }

  // one oscillator note (used by both sfx and the music sequencer, so it
  // must NOT check sfxOn - music would go silent when SFX are muted)
  tone(o) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + (o.delay || 0);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = o.type || "square";
    osc.frequency.setValueAtTime(o.freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + (o.dur || 0.15));
    const vol = (o.vol == null ? 0.3 : o.vol);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + (o.dur || 0.15));
    osc.connect(g); g.connect(o.dest || this.sfxBus);
    osc.start(t); osc.stop(t + (o.dur || 0.15) + 0.03);
  }
  // filtered noise burst (same: shared by music, so no sfxOn check here)
  noise(o) {
    if (!this.ctx || !this.noiseBuf) return;
    const t = this.ctx.currentTime + (o.delay || 0);
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter();
    f.type = o.filter || "lowpass";
    f.frequency.setValueAtTime(o.freq || 900, t);
    if (o.freqTo) f.frequency.exponentialRampToValueAtTime(o.freqTo, t + (o.dur || 0.25));
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol == null ? 0.4 : o.vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (o.dur || 0.25));
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfxBus);
    src.start(t); src.stop(t + (o.dur || 0.25) + 0.03);
  }

  sfx(name) {
    // prefer a generated sample when available
    if (this.samples && this.sfxOn) {
      const alias = AudioSystem.SFX_ALIAS[name] || name;
      const el = this.samples["sfx/" + alias];
      if (el) {
        try { const c = el.cloneNode(); c.volume = 0.8; c.play().catch(() => {}); } catch (e) {}
        return;
      }
    }
    if (!this.ctx || !this.sfxOn) return;
    switch (name) {
      case "click": this.tone({ freq: 620, type: "square", dur: 0.06, vol: 0.16, slide: 900 }); break;
      case "build":
        this.tone({ freq: 300, type: "triangle", dur: 0.1, vol: 0.28, slide: 620 });
        this.noise({ freq: 2200, freqTo: 500, dur: 0.16, vol: 0.18 }); break;
      case "upgrade":
        [0, 0.07, 0.14].forEach((d, i) => this.tone({ freq: 520 + i * 220, type: "triangle", dur: 0.12, vol: 0.2, delay: d }));
        break;
      case "sell": this.tone({ freq: 500, type: "sawtooth", dur: 0.16, vol: 0.2, slide: 180 }); break;
      case "error": this.tone({ freq: 170, type: "sawtooth", dur: 0.16, vol: 0.22, slide: 110 }); break;
      case "shoot": this.tone({ freq: 780, type: "square", dur: 0.045, vol: 0.07, slide: 320 }); break;
      case "shotgun":
        this.noise({ freq: 1800, freqTo: 260, dur: 0.16, vol: 0.28 });
        this.tone({ freq: 140, type: "square", dur: 0.1, vol: 0.16, slide: 60 }); break;
      case "sniper":
        this.tone({ freq: 950, type: "sawtooth", dur: 0.14, vol: 0.22, slide: 140 });
        this.noise({ freq: 2600, freqTo: 300, dur: 0.22, vol: 0.2 }); break;
      case "flame": this.noise({ freq: 700, freqTo: 2000, dur: 0.22, vol: 0.1, filter: "bandpass" }); break;
      case "tesla":
        [0, 0.045, 0.09].forEach((d) => this.tone({ freq: rand(900, 1500), type: "square", dur: 0.06, vol: 0.13, delay: d }));
        break;
      case "hit": this.tone({ freq: rand(260, 420), type: "square", dur: 0.04, vol: 0.08, slide: 150 }); break;
      case "zeath":
        this.noise({ freq: 1400, freqTo: 160, dur: 0.32, vol: 0.32 });
        this.tone({ freq: 190, type: "sawtooth", dur: 0.28, vol: 0.18, slide: 55 }); break;
      case "growl": this.tone({ freq: rand(70, 110), type: "sawtooth", dur: 0.5, vol: 0.14, slide: 45 }); break;
      case "spit": this.noise({ freq: 2400, freqTo: 700, dur: 0.18, vol: 0.16, filter: "bandpass" }); break;
      case "explode":
        this.noise({ freq: 1400, freqTo: 80, dur: 0.6, vol: 0.5 });
        this.tone({ freq: 90, type: "sine", dur: 0.5, vol: 0.35, slide: 35 }); break;
      case "freeze":
        [0, 0.06, 0.12, 0.18].forEach((d, i) => this.tone({ freq: 1200 + i * 380, type: "sine", dur: 0.2, vol: 0.16, delay: d }));
        break;
      case "repair":
        [0, 0.1, 0.2].forEach((d, i) => this.tone({ freq: 480 + i * 200, type: "triangle", dur: 0.18, vol: 0.2, delay: d }));
        break;
      case "wave":
        [0, 0.13, 0.26].forEach((d, i) => this.tone({ freq: [392, 494, 587][i], type: "triangle", dur: 0.3, vol: 0.24, delay: d }));
        break;
      case "achievement":
        [523, 659, 784, 1047].forEach((f, i) => this.tone({ freq: f, type: "triangle", dur: 0.34, vol: 0.24, delay: i * 0.09 }));
        break;
      case "boss":
        [0, 0.2, 0.4].forEach((d) => this.tone({ freq: 82, type: "sawtooth", dur: 0.5, vol: 0.3, delay: d, slide: 50 }));
        this.noise({ freq: 300, freqTo: 90, dur: 0.7, vol: 0.3 }); break;
      case "coin": this.tone({ freq: 1046, type: "triangle", dur: 0.08, vol: 0.2, slide: 1568 }); break;
      case "lose":
        [523, 466, 392, 294].forEach((f, i) => this.tone({ freq: f, type: "sawtooth", dur: 0.5, vol: 0.25, delay: i * 0.18 }));
        break;
    }
  }

  /* ---- music: a 16-step sequencer with a bass line and a lead ---- */
  startMusic(track) {
    track = track || "menu";
    const map = { menu: "music/menu", battle: "music/gameplay", boss: "music/boss", gameover: "music/gameover" };
    const key = map[track] || ("music/" + track);
    if (this.samples && this.samples[key]) {
      if (this.timer) { clearInterval(this.timer); this.timer = null; }
      if (this._musicKey === key && this.musicEl && !this.musicEl.paused) { this.track = track; this.playing = true; return; }
      if (this.musicEl) { try { this.musicEl.pause(); } catch (e) {} }
      this.musicEl = this.samples[key]; this._musicKey = key;
      this.musicEl.loop = true;
      this.musicEl.volume = this.musicOn ? 0.5 : 0;
      try { this.musicEl.currentTime = 0; this.musicEl.play().catch(() => {}); } catch (e) {}
      this.track = track; this.playing = true;
      return;
    }
    if (!this.ctx) return;
    if (this.musicEl) { try { this.musicEl.pause(); } catch (e) {} }
    this.track = track;
    this.playing = true;
    this.step = 0;
    this.nextTime = this.ctx.currentTime + 0.1;
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => this._schedule(), 40);
  }
  stopMusic() {
    this.playing = false;
    if (this.musicEl) { try { this.musicEl.pause(); } catch (e) {} }
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  }

  _schedule() {
    if (!this.ctx || !this.playing) return;
    const bassMenu = [110, 0, 110, 0, 146.8, 0, 110, 0, 98, 0, 98, 0, 130.8, 0, 146.8, 0];
    const leadMenu = [440, 0, 523, 0, 659, 0, 523, 0, 392, 0, 466, 0, 587, 0, 523, 0];
    const bassBattle = [110, 110, 0, 110, 110, 0, 146, 0, 110, 110, 0, 110, 165, 0, 146, 0];
    const leadBattle = [659, 0, 784, 659, 880, 0, 784, 0, 587, 0, 698, 587, 784, 0, 880, 0];
    const isBattle = this.track === "battle";
    const bass = isBattle ? bassBattle : bassMenu;
    const lead = isBattle ? leadBattle : leadMenu;
    const stepDur = isBattle ? 0.115 : 0.16;
    const ahead = this.ctx.currentTime + 0.25;
    while (this.nextTime < ahead) {
      const s = this.step % 16;
      const t = this.nextTime;
      const dest = this.musicBus;
      if (bass[s]) this.tone({ freq: bass[s], type: "triangle", dur: stepDur * 1.8, vol: 0.16, dest, delay: t - this.ctx.currentTime });
      if (lead[s] && (s % 2 === 0 || Math.random() < 0.6))
        this.tone({ freq: lead[s], type: "square", dur: stepDur * 1.2, vol: 0.05, dest, delay: t - this.ctx.currentTime });
      if (isBattle && s % 4 === 0) this.noise({ freq: 7000, freqTo: 4000, dur: 0.05, vol: 0.05, filter: "highpass", dest, delay: t - this.ctx.currentTime });
      this.nextTime += stepDur;
      this.step++;
    }
  }
}
